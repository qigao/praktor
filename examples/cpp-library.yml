name: "CPP Library Workflow"
description: "A standard workflow for C++ library development"

variables:
  configure_command: "cmake -B build -S ."
  build_command: "cmake --build build"
  test_command: "ctest --test-dir build"
  package_command: "cmake --build build --target package"
  notify_command: "echo Build and test for praktor-lib completed successfully"

tasks:
  - name: setup
    description: "Prepare build environment"
    command: $configure_command

  - name: build
    description: "Compile the project"
    depends_on: [setup]
    command: $build_command

  - name: test
    description: "Run unit tests"
    depends_on: [build]
    command: $test_command

  - name: package
    description: "Create distribution package"
    depends_on: [test]
    command: $package_command

  - name: notify
    description: "Notify team of success"
    depends_on: [package]
    command: $notify_command
