name: Gemini build summary
description: Request a short model summary and validate the returned text
services:
    model: examples/services/llm-gemini.yml

tasks:
    - name: call_gemini
      tool: model
      with:
          request: |
              {
                "contents": [
                  {"parts": [{"text": "Summarize this build result in one sentence: 71 tests passed, 0 failed."}]}
                ],
                "generationConfig": {"maxOutputTokens": 128}
              }

    - name: validate_summary
      depends_on: [call_gemini]
      actions:
          Sequence:
              - ParseJson:
                    input_key: $shell_output
                    path: "$.candidates[0].finishReason"
                    output_key: finish_reason
                    result: one
              - assert:
                    guard: { fields: [finish_reason], match: '$finish_reason == "STOP"' }
                    message: Gemini did not complete the text response
                    actual: $finish_reason
              - ParseJson:
                    input_key: $shell_output
                    path: "$.candidates[0].content.parts[0].text"
                    output_key: summary
                    result: one
              - assert:
                    guard: { fields: [summary], match: '$summary != "" && $summary != "null"' }
                    message: Gemini returned no summary text
