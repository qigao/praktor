name: Claude build summary
description: Request a short model summary and validate the returned text
services:
  model: examples/services/llm-claude.yml

tasks:
  - name: call_claude
    tool: model
    with:
      request: |
        {
          "model": "claude-haiku-4-5",
          "messages": [
            {"role": "user", "content": "Summarize this build result in one sentence: 71 tests passed, 0 failed."}
          ],
          "max_tokens": 128
        }

  - name: validate_summary
    depends_on: [call_claude]
    actions:
      Sequence:
        - ParseJson:
            input_key: $shell_output
            path: '$.stop_reason'
            output_key: finish_reason
            result: one
        - assert:
            guard: {fields: [finish_reason], match: '$finish_reason == "end_turn"'}
            message: Claude did not complete the text response
            actual: $finish_reason
        - ParseJson:
            input_key: $shell_output
            path: '$.content[?(@.type == "text")].text'
            output_key: summary
            result: first
        - assert:
            guard: {fields: [summary], match: '$summary != "" && $summary != "null"'}
            message: Claude returned no summary text
