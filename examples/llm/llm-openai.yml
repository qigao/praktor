name: OpenAI build summary
description: Request a short model summary and validate the returned text
services:
  model: examples/services/llm-openai.yml

tasks:
  - name: call_openai
    tool: model
    with:
      request: |
        {
          "model": "gpt-4o-mini",
          "messages": [
            {"role": "user", "content": "Summarize this build result in one sentence: 71 tests passed, 0 failed."}
          ],
          "max_completion_tokens": 128,
          "store": false
        }

  - name: validate_summary
    depends_on: [call_openai]
    actions:
      Sequence:
        - ParseJson:
            input_key: $shell_output
            path: '$.choices[0].finish_reason'
            output_key: finish_reason
            result: one
        - assert:
            guard: {fields: [finish_reason], match: '$finish_reason == "stop"'}
            message: OpenAI did not complete the text response
            actual: $finish_reason
        - ParseJson:
            input_key: $shell_output
            path: '$.choices[0].message.content'
            output_key: summary
            result: one
        - assert:
            guard: {fields: [summary], match: '$summary != "" && $summary != "null"'}
            message: OpenAI returned no summary text
