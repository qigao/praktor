name: API Integration with JSON Parsing

description: |
  Demonstrates JSON parsing and API integration using behavior trees.
  Fetches data from an API, parses it, and uses the results.

variables:
  API_BASE_URL: "https://api.example.com"
  API_TOKEN: "your-api-token-here"

env:
  API_TOKEN: "{{ env.API_TOKEN }}"

tasks:
  - name: fetch_and_parse_config
    sequence:
      # Step 1: Fetch configuration from API
      - shell:
          cmd: curl -s -H "Authorization Bearer {ctx.env.API_TOKEN}" {ctx.variables.API_BASE_URL}/config
          output_key: config_json

      # Step 2: Parse version from config
      - parse_json:
          input_key: config_json
          path: $.version
          output_key: api_version

      # Step 3: Parse environment from config
      - parse_json:
          input_key: config_json
          path: $.environment
          output_key: environment

      # Step 4: Parse feature flags
      - parse_json:
          input_key: config_json
          path: $.features.enabled
          output_key: enabled_features

      - shell: echo "API Version {ctx.tasks.fetch_and_parse_config.outputs.api_version}, Environment {ctx.tasks.fetch_and_parse_config.outputs.environment}"

  - name: fetch_user_data
    depends_on: [fetch_and_parse_config]
    sequence:
      # Fetch users from API
      - shell:
          cmd: curl -s -H "Authorization Bearer {ctx.env.API_TOKEN}" {ctx.variables.API_BASE_URL}/users
          output_key: users_json

      # Parse first user's ID
      - parse_json:
          input_key: users_json
          path: $.users[0].id
          output_key: first_user_id

      # Parse first user's name
      - parse_json:
          input_key: users_json
          path: $.users[0].name
          output_key: first_user_name

      # Parse total user count
      - parse_json:
          input_key: users_json
          path: $.total
          output_key: total_users

      - shell: echo "Found {ctx.tasks.fetch_user_data.outputs.total_users} users. First user {ctx.tasks.fetch_user_data.outputs.first_user_name} (ID {ctx.tasks.fetch_user_data.outputs.first_user_id})"

  - name: conditional_processing
    depends_on: [fetch_and_parse_config, fetch_user_data]
    fallback:
      # If environment is production, use strict validation
      - sequence:
          - shell: test "{ctx.tasks.fetch_and_parse_config.outputs.environment}" = "production"
          - check_exit_code: 0
          - shell: echo "Running production validation..."
          - shell: ./validate.sh --strict --users {ctx.tasks.fetch_user_data.outputs.total_users}

      # Otherwise, use relaxed validation
      - sequence:
          - shell: echo "Running development validation..."
          - shell: ./validate.sh --relaxed --users {ctx.tasks.fetch_user_data.outputs.total_users}

  - name: generate_summary
    depends_on: [conditional_processing]
    command: |
      echo "=== API Integration Summary ===" > summary.txt
      echo "API Version: {{ tasks.fetch_and_parse_config.outputs.api_version }}" >> summary.txt
      echo "Environment: {{ tasks.fetch_and_parse_config.outputs.environment }}" >> summary.txt
      echo "Total Users: {{ tasks.fetch_user_data.outputs.total_users }}" >> summary.txt
      echo "First User: {{ tasks.fetch_user_data.outputs.first_user_name }}" >> summary.txt
      cat summary.txt
