name: Orchestrator Leaf Nodes Demo

description: |
  Demonstrates orchestrator-friendly BT leaf nodes:
  - file_exists: File system checks
  - sleep: Explicit delays
  - set_variable: Blackboard manipulation

  HTTP is intentionally not modeled as a BT node here.
  Use shell/curl or script/http for network I/O.

variables:
  API_URL: "https://api.example.com"
  CONFIG_PATH: "/etc/myapp/config.yml"

tasks:
  # Demo 1: File Exists Node
  - name: file_checks
    sequence:
      - file_exists: {$CONFIG_PATH}
      - shell: echo "Config file found"

      - file_exists:
          path: /tmp/optional-cache.json
          output_key: cache_exists
          fail_if_missing: false

      - fallback:
          - sequence:
              - file_exists: /tmp/cache.json
              - shell: cp /tmp/cache.json ./data.json
          - shell:
              cmd: curl -s {$API_URL}/data
              output_key: fresh_data

  # Demo 2: Sleep Node
  - name: rate_limited_workflow
    sequence:
      - shell:
          cmd: curl -s {$API_URL}/endpoint1
          output_key: endpoint1
      - sleep: 1000
      - shell:
          cmd: curl -s {$API_URL}/endpoint2
          output_key: endpoint2

      - sleep: "5s"
      - shell:
          cmd: curl -s {$API_URL}/endpoint3
          output_key: endpoint3

      - sleep:
          duration: "30s"
          reason: "Waiting for async processing to complete"
      - shell:
          cmd: curl -s {$API_URL}/status
          output_key: status

  # Demo 3: Set Variable Node
  - name: state_machine
    sequence:
      - set_variable:
          key: deployment_status
          value: "starting"

      - shell: kubectl apply -f deployment.yml
      - set_variable:
          key: deployment_status
          value: "deployed"

      - sleep: "10s"
      - shell: kubectl rollout status deployment/myapp
      - set_variable:
          key: deployment_status
          value: "ready"

      - set_variable:
          key: deployed_version
          from_context: {@build.version}

  # Demo 4: Compose BT control flow with shell-driven API access
  - name: resilient_api_integration
    sequence:
      - file_exists:
          path: /tmp/api-cache.json
          output_key: cache_exists
          fail_if_missing: false

      - fallback:
          - sequence:
              - file_exists: /tmp/api-cache.json
              - set_variable:
                  key: data_source
                  value: "cache"
              - shell:
                  cmd: cat /tmp/api-cache.json
                  output_key: api_data
          - sequence:
              - set_variable:
                  key: data_source
                  value: "api"
              - shell:
                  cmd: curl -s {$API_URL}/data
                  output_key: api_data
              - sleep:
                  duration: "100ms"
                  reason: "Rate limit compliance"

      - shell: echo "Data source: {@resilient_api_integration.data_source}"
      - set_variable:
          key: processing_status
          value: "complete"

# Design Notes:
#
# - BT handles orchestration and control flow.
# - Shell handles side effects.
# - Script handles rich in-memory logic and HTTP via the built-in http module.
# - This keeps the orchestration grammar small and predictable.
