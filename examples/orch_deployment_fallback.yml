name: Deployment with Fallback Strategy

description: |
  Demonstrates fallback control flow for resilient deployments.
  Tries production deployment first, falls back to staging if it fails.

variables:
  APP_NAME: "myapp"
  VERSION: "1.0.0"
  REGISTRY: "docker.io/mycompany"

tasks:
  - name: build_image
    shell:
      cmd: docker build -t {ctx.variables.REGISTRY}/{ctx.variables.APP_NAME}:{ctx.variables.VERSION} .
      output_key: build_log

  - name: deploy_with_fallback
    depends_on: [build_image]
    fallback:
      # Strategy 1: Try production deployment
      - sequence:
          - shell: echo "Attempting production deployment..."
          - shell: kubectl set image deployment/{ctx.variables.APP_NAME} app={ctx.variables.REGISTRY}/{ctx.variables.APP_NAME}:{ctx.variables.VERSION} --context=production
          - check_exit_code: 0
          - shell: kubectl rollout status deployment/{ctx.variables.APP_NAME} --context=production --timeout=60s
          - check_exit_code: 0
          - shell:
              cmd: echo "Production deployment successful"
              output_key: deployment_status

      # Strategy 2: Fall back to staging
      - sequence:
          - shell: echo "Production deployment failed. Trying staging environment..."
          - shell: kubectl set image deployment/{ctx.variables.APP_NAME} app={ctx.variables.REGISTRY}/{ctx.variables.APP_NAME}:{ctx.variables.VERSION} --context=staging
          - check_exit_code: 0
          - shell: kubectl rollout status deployment/{ctx.variables.APP_NAME} --context=staging --timeout=60s
          - check_exit_code: 0
          - shell:
              cmd: echo "Staging deployment successful (production failed)"
              output_key: deployment_status

      # Strategy 3: All deployments failed
      - shell: echo "ERROR: All deployment strategies failed!" && exit 1

  - name: notify_team
    depends_on: [deploy_with_fallback]
    command: echo "Deployment completed. Status {{ tasks.deploy_with_fallback.outputs.deployment_status }}"
