name: "Standard Workflow"
description: "A basic Praktor workflow template"

variables:
  hello_command: "echo Hello from MyProject!"
  goodbye_command: "echo Execution of MyProject workflow finished."

tasks:
  - name: hello
    description: "Say hello"
    command: $hello_command

  - name: goodbye
    description: "Say goodbye"
    depends_on: [hello]
    command: $goodbye_command
