# Praktor Triggers Quick Start
# This workflow demonstrates trigger usage with the task-based system

variables:
  APP_NAME: "quickstart-app"

tasks:
  # Define reusable trigger tasks
  - name: write_build_success
    command: "echo Build completed for {{ APP_NAME }}"
    script: |
      fs.write("./build-success.txt", "Build completed for {{ APP_NAME }}");

  - name: write_test_failure
    command: "echo Tests failed"
    script: |
      fs.write("./test-failure.txt", "Tests failed: {{ failed_task_error }}");

  - name: write_deploy_log
    command: "echo Deployed successfully"
    script: |
      fs.append("./deploy-log.txt", "Deployed successfully\n");

  - name: write_workflow_complete
    command: "echo Workflow completed"
    script: |
      fs.write("./workflow-complete.txt", "Workflow completed\nApp: {{ APP_NAME }}");

  # Main workflow tasks
  - name: build
    command: "echo Building application..."
    triggers:
      on_success: [write_build_success]

  - name: test
    depends_on: [build]
    command: "echo Running tests... && exit 0"
    triggers:
      on_failure: [write_test_failure]

  - name: deploy
    depends_on: [test]
    command: "echo Deploying {{ APP_NAME }}..."
    triggers:
      on_failure: [rollback]
      on_success: [write_deploy_log]

  # Recovery task
  - name: rollback
    command: "echo Rolling back deployment..."

  - name: cleanup
    depends_on: [deploy]
    command: "echo Cleaning up temporary files..."
    triggers:
      on_complete: [write_workflow_complete]
