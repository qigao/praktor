name: "C++ Build Pipeline"
description: "A complete C++ build and test workflow"

variables:
  PROJECT_NAME: "praktor"
  BUILD_TYPE: "Release"
  BUILD_DIR: "out/build"

env:
  NOTIFICATION_WEBHOOK: "https://hooks.example.com/notify"

tasks:
  # Notification tasks
  - name: notify_test_failure
    command: "echo Test failed for {{ PROJECT_NAME }}"
    script: |
      http.post("{{ NOTIFICATION_WEBHOOK }}", json.stringify({"text": "Tests failed for {{ PROJECT_NAME }}"}));

  - name: notify_test_success
    command: "echo Tests passed for {{ PROJECT_NAME }}"

  # Build pipeline tasks
  - name: clean
    description: "Remove old build artifacts"
    command: "rm -rf {{ BUILD_DIR }}"
    continue_on_error: true

  - name: configure
    description: "Run CMake configuration"
    depends_on: [clean]
    command: "cmake -B {{ BUILD_DIR }} -DCMAKE_BUILD_TYPE={{ BUILD_TYPE }}"

  - name: build
    description: "Compile the project"
    depends_on: [configure]
    command: "cmake --build {{ BUILD_DIR }} --config {{ BUILD_TYPE }}"
    timeout: "15m"

  - name: test
    description: "Run test suite"
    depends_on: [build]
    command: "ctest --test-dir {{ BUILD_DIR }} -C {{ BUILD_TYPE }} --output-on-failure"
    retries:
      count: 1
      delay: "5s"
    triggers:
      on_failure: [notify_test_failure]
      on_success: [notify_test_success]
