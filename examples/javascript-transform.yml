name: "Data Transformation"
description: "Demonstrates using script for data extraction and transformation"

tasks:
  - name: fetch_data
    description: "Simulate fetching some JSON data"
    command: 'echo {"users": [{"id": 1, "name": "Alice", "role": "admin"}, {"id": 2, "name": "Bob", "role": "user"}], "meta": {"status": "ok"}}'
    output_format: json

  - name: transform
    description: "Extract admin users using JMESPath"
    depends_on: [fetch_data]
    command: "echo extracting admins"
    script: |
      var users = ctx.get("tasks.fetch_data.outputs.data");
      var admins = json.query(users, "users[?role=='admin'].name");
      ctx.output("admin_names", json.stringify(admins));
      ctx.output("count", json.query(users, "users[?role=='admin'] | length(@)"));

  - name: report
    description: "Output the transformed data"
    depends_on: [transform]
    command: "echo Found {{ tasks.transform.outputs.count }} admins: {{ tasks.transform.outputs.admin_names }}"
