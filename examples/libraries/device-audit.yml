name: Device audit library
variables:
  mode: standby
  minimum_voltage: '11000'
tasks:
  - name: prepare
    set_variable: audit_mode
    from: $mode
  - name: verify
    depends_on: [prepare]
    actions:
      Sequence:
        - assert:
            guard:
              fields: [audit_mode, minimum_voltage]
              match: '$audit_mode == "commissioning" && $minimum_voltage == "11000"'
        - {set_variable: audit_ready, value: ready}
    outputs: [$audit_ready]
