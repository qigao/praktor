# Enhanced on_failure Demo Workflow
# Demonstrates intelligent error handling with detailed failure context

variables:
  SERVICE_NAME: "demo-app"
  ENVIRONMENT: "production"
  VERSION: "v1.2.3"

tasks:
  # Main deployment task with comprehensive error handling
  - name: deploy_main_service
    type: run_command
    command: |
      echo "Deploying ${SERVICE_NAME} version ${VERSION} to ${ENVIRONMENT}"
      # Simulate different failure scenarios based on environment variable
      if [[ "${FAILURE_SCENARIO}" == "config_error" ]]; then
        echo "Configuration validation failed" >&2
        exit 1
      elif [[ "${FAILURE_SCENARIO}" == "resource_limit" ]]; then
        echo "Insufficient resources available" >&2
        exit 2  
      elif [[ "${FAILURE_SCENARIO}" == "timeout" ]]; then
        echo "Deployment timed out after 300 seconds" >&2
        exit 124
      else
        echo "Deployment successful!"
        echo '{"status": "deployed", "version": "v1.2.3", "replicas": 3}' 
      fi
    retries:
      count: 2
      delay: "10s"
    outputs:
      stdout_to_variable: "deploy_output"
      stderr_to_variable: "deploy_errors" 
      exit_code_to_variable: "deploy_exit_code"
      output_json_to_variable: "deploy_result"
    on_failure: [analyze_deployment_failure, notify_team]

  # Intelligent failure analysis and recovery
  - name: analyze_deployment_failure
    type: run_command
    command: |
      echo "=== DEPLOYMENT FAILURE ANALYSIS ==="
      echo "Failed Task: {{failed_task_name}}"
      echo "Task Type: {{failed_task_type}}"
      echo "Exit Code: {{failed_task_exit_code}}"
      echo "Error Message: {{failed_task_error}}"
      echo "STDOUT: {{failed_task_stdout}}"
      echo "STDERR: {{failed_task_stderr}}"
      echo ""
      
      # Intelligent recovery based on exit code
      case "{{failed_task_exit_code}}" in
        "1")
          echo "🔧 Configuration Error - Attempting automatic fix"
          echo "Validating configuration files..."
          echo "Rolling back to last known good configuration"
          ;;
        "2") 
          echo "📊 Resource Limit - Scaling strategy needed"
          echo "Current resource usage: HIGH"
          echo "Implementing resource optimization..."
          ;;
        "124")
          echo "⏰ Timeout Error - Infrastructure issue"  
          echo "Checking infrastructure health..."
          echo "Implementing timeout recovery..."
          ;;
        *)
          echo "❌ Unknown Error - Emergency procedures"
          echo "Initiating full rollback sequence"
          ;;
      esac
    outputs:
      stdout_to_variable: "analysis_result"

  # Team notification with rich failure context  
  - name: notify_team
    type: run_command
    command: |
      echo "🚨 DEPLOYMENT ALERT 🚨"
      echo ""
      echo "Service: {{SERVICE_NAME}}"
      echo "Environment: {{ENVIRONMENT}}"
      echo "Failed Task: {{failed_task_name}}"
      echo "Failure Type: {{failed_task_type}}"
      echo "Exit Code: {{failed_task_exit_code}}"
      echo ""
      echo "Error Details:"
      echo "{{failed_task_error}}"
      echo ""
      echo "Debug Information:"
      echo "STDOUT: {{failed_task_stdout}}"
      echo "STDERR: {{failed_task_stderr}}"
      echo ""
      echo "Analysis: {{analysis_result}}"
      echo ""
      echo "🔗 Runbook: https://wiki.company.com/deployment-failures"
      echo "📞 Escalation: Call +1-555-ONCALL"

  # Success path
  - name: post_deployment_verification
    type: run_command
    depends_on: [deploy_main_service]
    command: |
      echo "✅ Deployment successful!"
      echo "Service {{SERVICE_NAME}} v{{VERSION}} deployed to {{ENVIRONMENT}}"
      echo "Verification complete"