variables:
  APP_NAME: "demo-app"
  VERSION: "1.0.0"

env:
  SLACK_WEBHOOK: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"

tasks:
  # Task 1: Build with success trigger
  - name: build
    command: "echo Building {{ APP_NAME }} version {{ VERSION }}"
    triggers:
      on_success:
        - write_file:
            path: "./build-success.log"
            content: |
              Build completed successfully
              App: {{ APP_NAME }}
              Version: {{ VERSION }}
              Timestamp: {{ tasks.build.outputs.stdout }}
            mode: overwrite

  # Task 2: Test with failure handling
  - name: test
    depends_on: [build]
    command: "echo Running tests && exit 0"
    retries:
      count: 2
      delay: "2s"
    triggers:
      on_failure:
        - write_file:
            path: "./test-failure.log"
            content: "Tests failed: {{ failed_task_error }}"
            mode: append
        - run_task:
            task_name: notify_failure

  # Task 3: Deploy with multiple triggers
  - name: deploy
    depends_on: [test]
    command: "echo Deploying {{ APP_NAME }} to production"
    triggers:
      on_success:
        - http_post:
            url: "{{ env.SLACK_WEBHOOK }}"
            body: '{"text": "✅ Deployment successful: {{ APP_NAME }} v{{ VERSION }}"}'
            headers:
              Content-Type: "application/json"
        - write_file:
            path: "./deploy-history.log"
            content: "Deployed {{ APP_NAME }} v{{ VERSION }} at {{ tasks.deploy.outputs.stdout }}\n"
            mode: append
      on_failure:
        - http_post:
            url: "{{ env.SLACK_WEBHOOK }}"
            body: '{"text": "❌ Deployment failed: {{ failed_task_error }}"}'
        - run_task:
            task_name: rollback
      on_complete:
        - write_file:
            path: "./deploy-complete.log"
            content: "Deploy task completed with status: {{ tasks.deploy.status }}"
            mode: overwrite

  # Recovery task (triggered on failure)
  - name: rollback
    command: "echo Rolling back deployment"
    triggers:
      on_complete:
        - write_file:
            path: "./rollback.log"
            content: "Rollback executed"
            mode: overwrite

  # Notification task (triggered on test failure)
  - name: notify_failure
    command: "echo Sending failure notification"
