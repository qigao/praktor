variables:
  APP_NAME: "demo-app"
  VERSION: "1.0.0"

env:
  SLACK_WEBHOOK: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"

tasks:
  # Reusable trigger tasks
  - name: write_build_success_log
    command: "echo Build completed successfully for {{ APP_NAME }} v{{ VERSION }}"
    script: |
      fs.write("./build-success.log", "Build completed successfully\nApp: {{ APP_NAME }}\nVersion: {{ VERSION }}");

  - name: write_test_failure_log
    command: "echo Tests failed"
    script: |
      fs.append("./test-failure.log", "Tests failed: {{ failed_task_error }}\n");

  - name: notify_deploy_success
    command: "echo Deploy success notification sent"
    script: |
      http.post("{{ SLACK_WEBHOOK }}", json.stringify({"text": "Deployment successful: {{ APP_NAME }} v{{ VERSION }}"}));

  - name: write_deploy_history
    command: "echo Logging deploy history"
    script: |
      fs.append("./deploy-history.log", "Deployed {{ APP_NAME }} v{{ VERSION }}\n");

  - name: notify_deploy_failure
    command: "echo Deploy failure notification sent"
    script: |
      http.post("{{ SLACK_WEBHOOK }}", json.stringify({"text": "Deployment failed: {{ failed_task_error }}"}));

  - name: write_deploy_complete_log
    command: "echo Deploy task completed"
    script: |
      fs.write("./deploy-complete.log", "Deploy task completed");

  - name: write_rollback_log
    command: "echo Rollback executed"
    script: |
      fs.write("./rollback.log", "Rollback executed");

  # Main workflow tasks
  - name: build
    command: "echo Building {{ APP_NAME }} version {{ VERSION }}"
    triggers:
      on_success: [write_build_success_log]

  - name: test
    depends_on: [build]
    command: "echo Running tests && exit 0"
    retries:
      count: 2
      delay: "2s"
    triggers:
      on_failure: [write_test_failure_log, notify_failure]

  - name: deploy
    depends_on: [test]
    command: "echo Deploying {{ APP_NAME }} to production"
    triggers:
      on_success: [notify_deploy_success, write_deploy_history]
      on_failure: [notify_deploy_failure, rollback]
      on_complete: [write_deploy_complete_log]

  # Recovery task (triggered on failure)
  - name: rollback
    command: "echo Rolling back deployment"
    triggers:
      on_complete: [write_rollback_log]

  # Notification task (triggered on test failure)
  - name: notify_failure
    command: "echo Sending failure notification"
