name: "CPP Library Workflow"
description: "A standard workflow for C++ library development"

variables:
  PROJECT_NAME: "praktor-lib"
  BUILD_DIR: "build"

tasks:
  - name: setup
    description: "Prepare build environment"
    command: "cmake -B {{ BUILD_DIR }} -S ."

  - name: build
    description: "Compile the project"
    depends_on: [setup]
    command: "cmake --build {{ BUILD_DIR }}"

  - name: test
    description: "Run unit tests"
    depends_on: [build]
    command: "ctest --test-dir {{ BUILD_DIR }}"

  - name: package
    description: "Create distribution package"
    depends_on: [test]
    command: "cmake --build {{ BUILD_DIR }} --target package"

  - name: notify
    description: "Notify team of success"
    depends_on: [package]
    command: "echo Build completed successfully"
    triggers:
      on_success: [notify_success]

  - name: notify_success
    script:
      source: |
        print("Build and test for {{ PROJECT_NAME }} completed successfully!");
