name: {{#name}}{{name}}{{/name}}{{^name}}Praktor Workflow{{/name}}

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

{{#tasks}}
      - name: {{name}}
        run: |
          echo "Executing Praktor task: {{name}}"
          {{#command}}{{.}}{{/command}}
          {{#script}}echo "Running script task"{{/script}}
        {{#depends_on.0}}
        # depends_on: {{#depends_on}}{{.}} {{/depends_on}}
        {{/depends_on.0}}
{{/tasks}}
