name: "Behavior Tree Example Workflow"
description: "Demonstrates YAML behavior tree tasks in Praktor"

variables:
  PROJECT: "MyProject"
  BUILD_DIR: "build"

tasks:
  # Simple command (simplified syntax)
  - name: hello
    command: "echo Hello from {{ PROJECT }}!"

  # Behavior tree task with fallback logic
  - name: build
    depends_on: [hello]
    sequence:
      - shell: "echo Building {{ PROJECT }}..."
      - fallback:
          - shell: "cmake -B {{ BUILD_DIR }}"
          - sequence:
              - shell: "echo CMake failed, cleaning..."
              - shell: "rm -rf {{ BUILD_DIR }}"
              - shell: "cmake -B {{ BUILD_DIR }}"
      - shell: "cmake --build {{ BUILD_DIR }}"

  # Behavior tree task with parallel execution
  - name: test
    depends_on: [build]
    parallel:
      - shell:
          cmd: "echo Running unit tests..."
          output_key: "unit_out"
      - shell:
          cmd: "echo Running integration tests..."
          output_key: "int_out"
      - shell:
          cmd: "echo Running performance tests..."
          output_key: "perf_out"

  # Behavior tree task with output parsing
  - name: coverage
    depends_on: [test]
    sequence:
      - shell:
          cmd: "echo Lines executed: 85.5%"
          output_key: "cov_out"
      - parse_regex:
          input_key: "cov_out"
          pattern: "Lines executed:(\\d+\\.\\d+)%"
          capture_group: "1"
          output_key: "coverage_percent"

  # Behavior tree task with event-driven logic
  - name: deploy
    depends_on: [coverage]
    fallback:
      - shell: "echo Deploying to production..."
      - sequence:
          - shell: "echo Primary failed, trying backup..."
          - shell: "echo Deploying to backup server..."

  # Simple command for notification
  - name: notify
    depends_on: [deploy]
    command: "echo Workflow completed successfully!"

