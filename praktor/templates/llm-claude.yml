name: "Claude Chat Completion"
description: "Reusable template for Anthropic Claude API calls"

variables:
  CLAUDE_MODEL: "claude-sonnet-4-20250514"
  CLAUDE_MAX_TOKENS: "1024"
  CLAUDE_TEMPERATURE: "0.7"
  CLAUDE_SYSTEM_PROMPT: ""

tasks:
  - name: call_claude
    script: |
      var body = {
        "model": ctx.get("CLAUDE_MODEL"),
        "max_tokens": json.parse(ctx.get("CLAUDE_MAX_TOKENS")),
        "temperature": json.parse(ctx.get("CLAUDE_TEMPERATURE")),
        "messages": [{"role": "user", "content": ctx.get("PROMPT")}]
      };

      var sys = ctx.get("CLAUDE_SYSTEM_PROMPT");
      if (sys != "" && sys != null) {
        body.system = sys;
      }

      var resp = http.post("https://api.anthropic.com/v1/messages", body, {
        "headers": {
          "x-api-key": ctx.get("ANTHROPIC_API_KEY"),
          "anthropic-version": "2023-06-01",
          "Content-Type": "application/json"
        }
      });

      if (resp.status != 200) {
        fail("Claude API error " + resp.status + ": " + json.stringify(resp.data));
      }

      var answer = resp.data.content[0].text;
      ctx.output("answer", answer);
      ctx.output("model", resp.data.model);
      ctx.output("usage", resp.data.usage);
