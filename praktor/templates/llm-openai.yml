name: "OpenAI Chat Completion"
description: "Reusable template for OpenAI API calls"

variables:
  OPENAI_MODEL: "gpt-4o"
  OPENAI_MAX_TOKENS: "1024"
  OPENAI_TEMPERATURE: "0.7"
  OPENAI_SYSTEM_PROMPT: ""

tasks:
  - name: call_openai
    script: |
      var messages = [];
      var sys = ctx.get("OPENAI_SYSTEM_PROMPT");
      if (sys != "" && sys != null) {
        messages = [{"role": "system", "content": sys}];
      }
      messages = messages + [{"role": "user", "content": ctx.get("PROMPT")}];

      var resp = http.post("https://api.openai.com/v1/chat/completions", {
        "model": ctx.get("OPENAI_MODEL"),
        "messages": messages,
        "max_tokens": json.parse(ctx.get("OPENAI_MAX_TOKENS")),
        "temperature": json.parse(ctx.get("OPENAI_TEMPERATURE"))
      }, {
        "headers": {
          "Authorization": "Bearer " + ctx.get("OPENAI_API_KEY"),
          "Content-Type": "application/json"
        }
      });

      if (resp.status != 200) {
        fail("OpenAI API error " + resp.status + ": " + json.stringify(resp.data));
      }

      var answer = resp.data.choices[0].message.content;
      ctx.output("answer", answer);
      ctx.output("model", resp.data.model);
      ctx.output("usage", resp.data.usage);
