name: Service Stop Example
description: |
  Standalone Behavior Tree (BT) workflow for stopping a system service.

variables:
  SERVICE_NAME: "nginx"

tasks:
  - name: service_stop
    script: |
      import("os");
      var result = os.service_stop(ctx.get("SERVICE_NAME"));
      ctx.output("result", result);

  - name: emit_result
    depends_on: [service_stop]
    script: |
      import("./result_models.tbs");
      var result = ctx.get("tasks.service_stop.outputs.result");
      var success = result != null and result.success == 1;
      var status = "failed";
      if (success) {
        status = "success";
      }
      var payload = StatusResult();
      payload.status = status;
      payload.action = make_action_result(
        "stop", ctx.get("SERVICE_NAME"), success, false, result);
      var jsonStr = mapper.write_json(payload);
      ctx.output_text("result", jsonStr);
      log.info("Service stop result: " + jsonStr);
