name: Core-only real SDK integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "CMakeUserPresets.json"
      - "CMakePresets.json"
      - "presets/**"
      - "packaging/nuget/Praktor.Native.csproj"
      - "ProjectOptions.cmake"
      - "cmake/**"
      - "praktor/**"
      - "actions/**"
      - "sdk/**"
      - "shared/**"
      - "vcpkg.json"
      - ".github/workflows/core-only-real-sdk.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: praktor-core-only-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RID: linux-x64
      TRIPLET: x64-linux
      HOST_TRIPLET: x64-linux
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm

      - name: Restore latest core SDK dependencies
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/RestoreNativeSdks.ps1 -Rid linux-x64 -CoreOnly

      - name: Build and test core-only SDK
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset ci-linux-sdk -DENABLE_SCRIPT_ENGINE=OFF
          cmake --build --preset ci-linux-sdk --parallel 2
          ctest --preset ci-linux-sdk --output-on-failure
          cmake --build --preset install-ci-linux-sdk
