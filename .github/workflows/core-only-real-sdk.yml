name: Core-only real SDK integration

on:
  workflow_dispatch:
    inputs:
      salts_utils_ref:
        description: SaltsUtils candidate revision exporting Salts::YamlParser and Salts::BehaviorTree
        type: string
        default: d576cf5e0132052669c8385c2ce1f05782e44483
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "CMakeUserPresets.json"
      - "CMakePresets.json"
      - "presets/**"
      - "packaging/nuget/Praktor.Native.csproj"
      - "ProjectOptions.cmake"
      - "cmake/**"
      - "praktor/**"
      - "actions/**"
      - "sdk/**"
      - "shared/**"
      - "schema/**"
      - "grammar.schema.json"
      - "tools/**"
      - "vcpkg.json"
      - ".github/workflows/core-only-real-sdk.yml"
      - ".github/workflows/c11-source-tsan.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: praktor-core-only-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  integration:
    name: ${{ matrix.rid }} / ${{ matrix.sdk }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows, macos]
        sdk: [rc2, yaml-parser, behavior-tree]
        include:
          - {platform: linux, runner: ubuntu-24.04, rid: linux-x64, triplet: x64-linux, preset: ci-linux-sdk, producer: ci-sdk-release-user}
          - {platform: windows, runner: windows-2025, rid: windows-x64, triplet: x64-windows, preset: ci-windows-sdk, producer: ci-win-sdk-release-user}
          - {platform: macos, runner: macos-15, rid: macos-arm64, triplet: arm64-osx, preset: ci-macos-sdk, producer: ci-sdk-release-user}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RID: ${{ matrix.rid }}
      TRIPLET: ${{ matrix.triplet }}
      HOST_TRIPLET: ${{ matrix.triplet }}
      CMAKE_PRESET: ${{ matrix.preset }}
      SDK_VARIANT: ${{ matrix.sdk }}
      PRODUCER_PRESET: ${{ matrix.producer }}
      SALTS_UTILS_SOURCE_REF: ${{ inputs.salts_utils_ref || 'd576cf5e0132052669c8385c2ce1f05782e44483' }}
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/cache/restore@v4
        id: ccache
        with:
          path: ${{ env.CCACHE_DIR }}
          key: praktor-ccache-v1-${{ matrix.rid }}-release-core-${{ matrix.sdk }}-${{ hashFiles('CMakeUserPresets.json', 'vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            praktor-ccache-v1-${{ matrix.rid }}-release-core-${{ matrix.sdk }}-${{ hashFiles('CMakeUserPresets.json', 'vcpkg.json') }}-

      - name: Prepare Unix tools
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y ccache ninja-build pkg-config nasm libudev-dev
          else
            brew install ccache ninja nasm autoconf automake autoconf-archive libtool
            test "$(uname -m)" = arm64
          fi

      - name: Prepare Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ccache ninja nasm --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Tool installation failed' }
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC installation was not found' }
          if (-not $env:QIGAO_VCPKG_WINDOWS_TRIPLET) { throw 'Shared cache did not select a Windows triplet' }
          "VSINSTALL=$vs" >> $env:GITHUB_ENV
          "TRIPLET=$env:QIGAO_VCPKG_WINDOWS_TRIPLET" >> $env:GITHUB_ENV
          "HOST_TRIPLET=$env:QIGAO_VCPKG_WINDOWS_TRIPLET" >> $env:GITHUB_ENV
          "QIGAO_VCPKG_ROOT=$env:VCPKG_ROOT" >> $env:GITHUB_ENV

      - name: Reset compiler cache statistics
        shell: pwsh
        run: ccache --zero-stats

      - name: Restore published core SDK baseline
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/RestoreNativeSdks.ps1 -Rid $env:RID -CoreOnly -SaltsUtilsVersion 4.3.0-rc.2

      - name: Checkout candidate SaltsUtils SDK source
        if: matrix.sdk != 'rc2'
        uses: actions/checkout@v4
        with:
          repository: qigao/salts-utils
          ref: ${{ env.SALTS_UTILS_SOURCE_REF }}
          path: build/salts-utils-source
          persist-credentials: false

      - name: Select candidate SDK build environment
        if: matrix.sdk != 'rc2'
        shell: pwsh
        run: |
          "QIGAO_SDK_RID=$env:RID" >> $env:GITHUB_ENV
          "QIGAO_TARGET_TRIPLET=$env:TRIPLET" >> $env:GITHUB_ENV

      - name: Build candidate SDK on Unix
        if: matrix.sdk != 'rc2' && runner.os != 'Windows'
        working-directory: build/salts-utils-source
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset "$PRODUCER_PRESET"
          cmake --build --preset "$PRODUCER_PRESET" --parallel 2
          cmake --build --preset "install-$PRODUCER_PRESET" --parallel 2

      - name: Build candidate SDK on Windows
        if: matrix.sdk != 'rc2' && runner.os == 'Windows'
        working-directory: build/salts-utils-source
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          cmake --preset "%PRODUCER_PRESET%"
          if errorlevel 1 exit /b 1
          cmake --build --preset "%PRODUCER_PRESET%" --parallel 2
          if errorlevel 1 exit /b 1
          cmake --build --preset "install-%PRODUCER_PRESET%" --parallel 2
          if errorlevel 1 exit /b 1

      - name: Select installed SaltsUtils candidate
        if: matrix.sdk != 'rc2'
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "build/salts-utils-source/stage/sdk/$env:RID"
          "SALTS_UTILS_ROOT=$root" >> $env:GITHUB_ENV

      - name: Build and test core-only SDK on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SDK_VARIANT" == behavior-tree ]]; then
            cmake --preset "$CMAKE_PRESET" -DENABLE_SCRIPT_ENGINE=OFF -DPRAKTOR_ENABLE_C11_ACTIONS=ON
          else
            cmake --preset "$CMAKE_PRESET" -DENABLE_SCRIPT_ENGINE=OFF
          fi
          cmake --build --preset "$CMAKE_PRESET" --parallel 2
          ctest --preset "$CMAKE_PRESET" --output-on-failure --output-junit build/ci-sdk/ctest.xml
          cmake --build --preset "install-$CMAKE_PRESET" --parallel 2

      - name: Build and test core-only SDK on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          if "%SDK_VARIANT%"=="behavior-tree" (
            cmake --preset "%CMAKE_PRESET%" -DENABLE_SCRIPT_ENGINE=OFF -DPRAKTOR_ENABLE_C11_ACTIONS=ON
          ) else (
            cmake --preset "%CMAKE_PRESET%" -DENABLE_SCRIPT_ENGINE=OFF
          )
          if errorlevel 1 exit /b 1
          cmake --build --preset "%CMAKE_PRESET%" --parallel 2
          if errorlevel 1 exit /b 1
          ctest --preset "%CMAKE_PRESET%" --output-on-failure --output-junit build/ci-sdk/ctest.xml
          if errorlevel 1 exit /b 1
          cmake --build --preset "install-%CMAKE_PRESET%" --parallel 2
          if errorlevel 1 exit /b 1

      # Source-instrument the opt-in C11 consumer without multiplying the
      # nine-platform SDK matrix. The complete real WorkflowRunner TSan gate
      # is in c11-source-tsan.yml with *fully instrumented* Salts + SaltsUtils.
      # This job uses released Salts (mixed instrumentation) and cannot
      # attest its async logger's release/acquire synchronization.
      - name: C11 Process lifecycle ASan and UBSan
        if: matrix.platform == 'linux' && matrix.sdk == 'behavior-tree'
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: bash cmake/ci/qualify-c11-lifetime-sanitizers.sh address

      - name: C11 Session consumer-only TSan smoke
        if: matrix.platform == 'linux' && matrix.sdk == 'behavior-tree'
        shell: bash
        env:
          TSAN_OPTIONS: halt_on_error=1:history_size=7
        run: bash cmake/ci/qualify-c11-lifetime-sanitizers.sh thread

      - name: Report compiler cache statistics
        if: always()
        shell: pwsh
        run: |
          if (Get-Command ccache -ErrorAction SilentlyContinue) { ccache --show-stats }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-diagnostics-${{ matrix.rid }}-${{ matrix.sdk }}
          path: |
            build/ci-sdk/ctest.xml
            build/ci-sdk/Testing/Temporary/LastTest.log
            build/ci-c11-address/Testing/Temporary/LastTest.log
            build/ci-c11-thread/Testing/Temporary/LastTest.log
            build/ci-sdk/CMakeFiles/CMakeConfigureLog.yaml
            build/salts-utils-source/build/ci-sdk/**/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

      - uses: actions/cache/save@v4
        if: always() && steps.ccache.outcome == 'success' && steps.ccache.outputs.cache-primary-key != steps.ccache.outputs.cache-matched-key
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache.outputs.cache-primary-key }}

  # Mandatory, source-instrumented P1 verification performed directly in the
  # Core-only run. This avoids a second PR workflow and local reusable workflow
  # resolution failures on unmerged feature branches.
  complete-source-tsan:
    name: Salts rc17 + SaltsUtils BT/Process + Praktor TSan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SALTS_RC17_SHA: 6d6fd387cb245be8d7b0d866f9babad026a26832
      SALTS_UTILS_SHA: d576cf5e0132052669c8385c2ce1f05782e44483
      QIGAO_SDK_RID: linux-x64
      QIGAO_TARGET_TRIPLET: x64-linux
      RID: linux-x64
      TRIPLET: x64-linux
      HOST_TRIPLET: x64-linux
      TSAN_OPTIONS: halt_on_error=1:exitcode=66
      CCACHE_DIR: ${{ github.workspace }}/.cache/c11-full-source-tsan
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout immutable Salts rc17
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: 6d6fd387cb245be8d7b0d866f9babad026a26832
          path: build/p1-salts-source
          persist-credentials: false

      - name: Checkout combined BehaviorTree / Process SDK
        uses: actions/checkout@v4
        with:
          repository: qigao/salts-utils
          ref: d576cf5e0132052669c8385c2ce1f05782e44483
          path: build/p1-salts-utils-source
          persist-credentials: false

      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@0dc254695917bc180504d916240292e9096e9da5
        with:
          mode: read

      - uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@0dc254695917bc180504d916240292e9096e9da5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore unrelated official CHttp native SDK
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/RestoreNativeSdks.ps1 -Rid linux-x64 -CoreOnly -SaltsUtilsVersion 4.3.0-rc.2

      - name: Attest source inputs and compiler prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ccache ninja-build nasm pkg-config binutils python3
          test "$(git -C build/p1-salts-source rev-parse HEAD)" = "$SALTS_RC17_SHA"
          test "$(git -C build/p1-salts-source hash-object utils/src/tlog.c)" = "7f3781d262a7a5e432362c03351c1ca51c0a3ac4"
          test "$(git -C build/p1-salts-utils-source rev-parse HEAD)" = "$SALTS_UTILS_SHA"
          test -n "$RE2C_ROOT"
          test -n "$VCPKG_ROOT"
          echo "Salts rc17=$SALTS_RC17_SHA; SaltsUtils=$SALTS_UTILS_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and install fully instrumented Salts rc17
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/p1-salts-tsan-sdk"
          cmake --preset linux-tsan-ci -S build/p1-salts-source -B build/p1-salts-tsan \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX="$stage" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DENABLE_SANITIZER_ADDRESS=OFF -DENABLE_SANITIZER_THREAD=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/p1-salts-tsan --parallel 2
          cmake --install build/p1-salts-tsan
          test -f "$stage/lib/libsalts.so.2.3"
          test -f "$stage/lib/cmake/Salts/SaltsConfig.cmake"
          echo "SALTS_ROOT=$stage" >> "$GITHUB_ENV"
          echo "SALTS_SOURCE_TSAN_ROOT=$stage" >> "$GITHUB_ENV"

      - name: Build and install fully instrumented combined SaltsUtils
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/p1-salts-utils-tsan-sdk"
          cmake --preset ci-sdk-release-user -S build/p1-salts-utils-source \
            -B build/p1-salts-utils-tsan \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX="$stage" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DENABLE_SANITIZER_THREAD=ON -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF \
            -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/p1-salts-utils-tsan --parallel 2
          cmake --install build/p1-salts-utils-tsan
          test -f "$stage/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          test -f "$stage/include/salts/process_retainer.h"
          test -f "$stage/include/salts/behavior_tree.h"
          echo "SALTS_UTILS_ROOT=$stage" >> "$GITHUB_ENV"
          echo "SALTS_UTILS_SOURCE_TSAN_ROOT=$stage" >> "$GITHUB_ENV"

      - name: Audit actual original-source TSan translation units
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee build/p1-source-tsan-audit.json
          import json
          from pathlib import Path
          source_units = {
              "Salts": (Path("build/p1-salts-tsan/compile_commands.json"), [
                  "/utils/src/tlog.c",
                  "/utils/src/cmeta_buffer.c",
                  "/utils/src/cmeta_thread.c",
                  "/concurrency/src/disruptor.c",
                  "/platform/src/thread_posix.c",
              ]),
              "SaltsUtils": (Path("build/p1-salts-utils-tsan/compile_commands.json"), [
                  "/cflow-process/src/process.c",
                  "/cflow-process/src/process_retainer.c",
                  "/behavior-tree/src/behavior_tree.c",
              ]),
          }
          attestation = {}
          for name, (path, required) in source_units.items():
              rows = json.loads(path.read_text())
              for suffix in required:
                  matches = [r for r in rows if r["file"].replace("\\", "/").endswith(suffix)]
                  if len(matches) != 1:
                      raise SystemExit(f"{name}: missing/duplicate {suffix}: {len(matches)}")
                  command = matches[0].get("command") or " ".join(matches[0].get("arguments", []))
                  if "-fsanitize=thread" not in command:
                      raise SystemExit(f"{name}: source unit not compiled under TSan: {suffix}")
                  attestation[suffix] = {"owner": name, "tsan": True}
          print(json.dumps(attestation, indent=2))
          PY

      - name: Compile actual C11 workflow and Process consumer under TSan
        shell: bash
        env:
          TSAN_OPTIONS: halt_on_error=1:exitcode=66
        run: |
          set -euo pipefail
          flags="-fsanitize=thread -fno-omit-frame-pointer -fno-optimize-sibling-calls -O1 -g"
          cmake --preset ci-linux-sdk -B build/p1-praktor-tsan \
            -DCMAKE_BUILD_TYPE=Debug -DENABLE_TESTS=ON \
            -DENABLE_SCRIPT_ENGINE=OFF -DPRAKTOR_ENABLE_C11_ACTIONS=ON \
            "-DCMAKE_C_FLAGS=$flags" "-DCMAKE_CXX_FLAGS=$flags" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread" \
            "-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=thread"
          cmake --build build/p1-praktor-tsan \
            --target core_only_workflow_test.praktor_lib actions_c11_tree_executor_session_test \
            --parallel 2

      - name: Require fully instrumented Salts dynamic linkage
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$SALTS_SOURCE_TSAN_ROOT/lib:$SALTS_UTILS_SOURCE_TSAN_ROOT/lib:$CHTTP_ROOT/lib:${LD_LIBRARY_PATH:-}"
          binary=build/p1-praktor-tsan/bin/core_only_workflow_test.praktor_lib
          nm -D "$binary" | grep -F ' __tsan_init'
          ldd "$binary" | tee build/p1-source-tsan-linked-libraries.txt
          grep -F "$SALTS_SOURCE_TSAN_ROOT/lib/libsalts.so.2.3" \
            build/p1-source-tsan-linked-libraries.txt
          if grep -F 'not found' build/p1-source-tsan-linked-libraries.txt; then
            echo "Missing source-TSan runtime dependency" >&2
            exit 1
          fi

      - name: Run real YAML cancellation and C11 lifetime under unsuppressed TSan
        shell: bash
        env:
          TSAN_OPTIONS: halt_on_error=1:exitcode=66
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$SALTS_SOURCE_TSAN_ROOT/lib:$SALTS_UTILS_SOURCE_TSAN_ROOT/lib:$CHTTP_ROOT/lib:${LD_LIBRARY_PATH:-}"
          # Exercise separate real native processes repeatedly under fully
          # source-instrumented TSan. The consumer-only mixed-binary TSan
          # smoke in core-only-real-sdk.yml is NOT a substitute for this.
          for iteration in 1 2 3; do
            echo "P1 full-source TSan owner/cancellation iteration=$iteration"
            ctest --test-dir build/p1-praktor-tsan \
              --no-tests=error --output-on-failure --parallel 1 --timeout 90 \
              -R '^(core_only_workflow_test\.praktor_lib|actions_c11_tree_executor_session_test)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c11-complete-source-tsan-evidence
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/p1-source-tsan-audit.json
            build/p1-source-tsan-linked-libraries.txt
            build/p1-salts-tsan/compile_commands.json
            build/p1-salts-utils-tsan/compile_commands.json
            build/p1-praktor-tsan/Testing/Temporary/LastTest.log
            build/p1-salts-tsan/CMakeFiles/CMakeConfigureLog.yaml
            build/p1-salts-utils-tsan/CMakeFiles/CMakeConfigureLog.yaml

          done
          echo 'P1 full-source TSan: 3/3 complete real WorkflowRunner+Session iterations PASS' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c11-complete-source-tsan-evidence
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/p1-source-tsan-audit.json
            build/p1-source-tsan-linked-libraries.txt
            build/p1-salts-tsan/compile_commands.json
            build/p1-salts-utils-tsan/compile_commands.json
            build/p1-praktor-tsan/Testing/Temporary/LastTest.log
            build/p1-salts-tsan/CMakeFiles/CMakeConfigureLog.yaml
            build/p1-salts-utils-tsan/CMakeFiles/CMakeConfigureLog.yaml
