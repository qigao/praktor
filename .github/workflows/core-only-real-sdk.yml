name: Core-only real SDK integration

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: praktor-core-only-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SALTS_SHA: f1d8466244e6e0d74baed86e99ae6205e431557f
      SALTS_UTILS_SHA: 62576265ac66b0000127a04936f108a3dbb3f004
      CHTTP_SHA: 9d2e64ee46d15541a24b61ae979df0cca8615d3b
      VCPKG_SHA: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
      TURBOAGENT_SHA: ebf99fd0944b07065055b3db641bcfc7f070c984
      CMAKE_BUILD_PARALLEL_LEVEL: 2

    steps:
      - name: Checkout exact Praktor head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify source identity
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code

      - name: Checkout pinned public dependencies
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: ${{ env.SALTS_SHA }}
          path: deps/salts
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: qigao/salts-utils
          ref: ${{ env.SALTS_UTILS_SHA }}
          path: deps/salts-utils
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: qigao/chttp
          ref: ${{ env.CHTTP_SHA }}
          path: deps/chttp
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_SHA }}
          path: vcpkg
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact TurboAgent Praktor adapter
        uses: actions/checkout@v4
        with:
          repository: qigao/TurboAgent
          ref: ${{ env.TURBOAGENT_SHA }}
          path: deps/turboagent
          persist-credentials: false

      - name: Prepare public toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm curl xz-utils
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          sudo mkdir -p /opt/salts /opt/salts-utils /opt/chttp /opt/praktor
          sudo chown -R "$USER":"$USER" /opt/salts /opt/salts-utils /opt/chttp /opt/praktor
          sudo ln -sfn "$GITHUB_WORKSPACE/vcpkg" /opt/vcpkg
          bash deps/salts-utils/cmake/ci/install-re2c.sh

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: praktor-core-only-vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_SHA }}-v1

      - name: Build and install pinned Salts
        working-directory: deps/salts
        env:
          PROJECT_ROOT: ${{ runner.temp }}/salts-project
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        shell: bash
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user             -DENABLE_SANITIZER_ADDRESS=OFF             -DENABLE_SANITIZER_UNDEFINED=OFF
          cmake --build build/linux-gcc-debug --target install -j2
          package="$RUNNER_TEMP/salts-project/external/pkgs/salts/debug"
          test -f "$package/lib/cmake/Salts/SaltsConfig.cmake"
          ln -sfn "$package" /opt/salts/debug

      - name: Build host Lemon for SaltsUtils
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S deps/salts-utils/tools/lemon                 -B deps/salts-utils/build/host-lemon                 -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build deps/salts-utils/build/host-lemon --target lemon -j2

      - name: Build and install pinned SaltsUtils
        working-directory: deps/salts-utils
        shell: bash
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user             -DENABLE_SANITIZER_ADDRESS=OFF             -DENABLE_SANITIZER_UNDEFINED=OFF             -DSALTS_UTILS_HOST_LEMON_EXECUTABLE="$GITHUB_WORKSPACE/deps/salts-utils/build/host-lemon/lemon"             -DDATABIND_HOST_LEMON_EXECUTABLE="$GITHUB_WORKSPACE/deps/salts-utils/build/host-lemon/lemon"
          cmake --build build/linux-gcc-debug --target install -j2
          test -f /opt/salts-utils/debug/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake

      - name: Build and install pinned CHTTP
        shell: bash
        env:
          SALTS_ROOT: /opt/salts/debug
          SALTS_UTILS_ROOT: /opt/salts-utils/debug
        run: |
          set -euxo pipefail
          cmake -S deps/chttp -B deps/chttp/build/praktor-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=ON \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed/chttp" \
            -DCMAKE_INSTALL_PREFIX=/opt/chttp/debug \
            -DSALTS_ROOT=/opt/salts/debug \
            -DSALTS_UTILS_ROOT=/opt/salts-utils/debug \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_BENCHMARKS=OFF
          cmake --build deps/chttp/build/praktor-ci --target install -j2
          test -f /opt/chttp/debug/lib/cmake/Chttp/ChttpConfig.cmake
          test -f /opt/chttp/debug/include/http_client/http.h
          test -f /opt/chttp/debug/include/s3/s3_signer.h

      - name: Configure real Praktor without TurboScript
        shell: bash
        env:
          SALTS_ROOT: /opt/salts/debug
          SALTS_UTILS_ROOT: /opt/salts-utils/debug
          CHTTP_ROOT: /opt/chttp/debug
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          set -euxo pipefail
          rm -rf build/linux-gcc-debug
          cmake --preset linux-dev-user             -DENABLE_SCRIPT_ENGINE=OFF             -DENABLE_TESTS=ON
          cache=build/linux-gcc-debug/CMakeCache.txt
          grep -F 'ENABLE_SCRIPT_ENGINE:BOOL=OFF' "$cache"
          if grep -F 'TurboScript_DIR' "$cache"; then
            echo "core-only configure unexpectedly resolved TurboScript" >&2
            exit 1
          fi

      - name: Build and run real core-only CTest
        shell: bash
        env:
          SALTS_ROOT: /opt/salts/debug
          SALTS_UTILS_ROOT: /opt/salts-utils/debug
          CHTTP_ROOT: /opt/chttp/debug
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          LD_LIBRARY_PATH: /opt/chttp/debug/lib:/opt/salts-utils/debug/lib:/opt/salts/debug/lib
        run: |
          set -euxo pipefail
          cmake --build build/linux-gcc-debug -j2
          ctest --test-dir build/linux-gcc-debug --no-tests=error --output-on-failure

      - name: Install real core-only Praktor SDK
        shell: bash
        env:
          SALTS_ROOT: /opt/salts/debug
          SALTS_UTILS_ROOT: /opt/salts-utils/debug
          CHTTP_ROOT: /opt/chttp/debug
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          set -euxo pipefail
          cmake --build build/linux-gcc-debug --target install -j2
          config=/opt/praktor/debug/lib/cmake/Praktor/PraktorConfig.cmake
          test -f "$config"
          test -f /opt/praktor/debug/include/praktor.h
          grep -F 'if("OFF" STREQUAL "ON")' "$config"
          grep -F 'find_dependency(TurboScript CONFIG)' "$config"

      - name: Build installed-package ABI smoke
        shell: bash
        run: |
          set -euxo pipefail
          smoke="$RUNNER_TEMP/praktor-real-smoke"
          mkdir -p "$smoke"
          cat > "$smoke/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(praktor_real_smoke LANGUAGES C)
          find_package(Praktor CONFIG REQUIRED)
          add_executable(praktor_real_smoke main.c)
          target_link_libraries(praktor_real_smoke PRIVATE Praktor::Praktor)
          CMAKE
          cat > "$smoke/main.c" <<'C'
          #include <praktor.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>

          static int run_one(const char *path, int expect_success, const char *needle) {
            praktor_execute_request request = PRAKTOR_EXECUTE_REQUEST_INIT;
            praktor_owned_json output = PRAKTOR_OWNED_JSON_INIT;
            praktor_error error = PRAKTOR_ERROR_INIT;
            praktor_result result;

            request.workflow_path = path;
            request.input_json = "{}";
            request.input_json_size = 2;
            result = praktor_execute_workflow(&request, &output, &error);

            if (expect_success) {
              if (result != PRAKTOR_RESULT_SUCCESS) {
                fprintf(stderr, "expected success, got %d: %s\n", (int)result, error.message);
                praktor_release_json(&output);
                return 1;
              }
            } else if (result != PRAKTOR_RESULT_EXECUTION_FAILED) {
              fprintf(stderr, "expected workflow failure, got %d: %s\n", (int)result, error.message);
              praktor_release_json(&output);
              return 1;
            }

            if (!output.data || !strstr(output.data, needle)) {
              fprintf(stderr, "missing result evidence: %s\n", needle);
              if (output.data) fprintf(stderr, "%s\n", output.data);
              praktor_release_json(&output);
              return 1;
            }
            praktor_release_json(&output);
            return 0;
          }

          int main(int argc, char **argv) {
            const praktor_api *api = praktor_get_api();
            if (argc != 3) return 2;
            if (!api) return 3;
            if ((api->capabilities & PRAKTOR_CAPABILITY_JSON_WORKFLOW) == 0) return 4;
            if ((api->capabilities & PRAKTOR_CAPABILITY_SCRIPT_ENGINE) != 0) return 5;
            if (run_one(argv[1], 1, "success") != 0) return 6;
            if (run_one(argv[2], 0, "ENABLE_SCRIPT_ENGINE=OFF") != 0) return 7;
            puts("PRAKTOR_CORE_ONLY_REAL_ABI_OK");
            return 0;
          }
          C
          cat > "$smoke/command.yml" <<'YAML'
          tasks:
            - name: command_ok
              command: "printf praktor-core-only-ok"
          YAML
          cat > "$smoke/script.yml" <<'YAML'
          tasks:
            - name: script_rejected
              script: |
                ctx.output("unexpected", true);
          YAML

          export SALTS_ROOT=/opt/salts/debug
          export SALTS_UTILS_ROOT=/opt/salts-utils/debug
          export CMAKE_PREFIX_PATH="/opt/praktor/debug:/opt/chttp/debug:/opt/salts-utils/debug:/opt/salts/debug"
          cmake -S "$smoke" -B "$smoke/build" -G Ninja
          cmake --build "$smoke/build" -j2

          export LD_LIBRARY_PATH="/opt/praktor/debug/lib:/opt/chttp/debug/lib:/opt/salts-utils/debug/lib:/opt/salts/debug/lib:$GITHUB_WORKSPACE/vcpkg_installed/linux/x64-linux/debug/lib:$GITHUB_WORKSPACE/vcpkg_installed/linux/x64-linux/lib:$GITHUB_WORKSPACE/deps/salts/vcpkg_installed/linux/x64-linux/debug/lib:$GITHUB_WORKSPACE/deps/salts/vcpkg_installed/linux/x64-linux/lib:$GITHUB_WORKSPACE/deps/salts-utils/vcpkg_installed/linux/x64-linux/debug/lib:$GITHUB_WORKSPACE/deps/salts-utils/vcpkg_installed/linux/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          "$smoke/build/praktor_real_smoke" "$smoke/command.yml" "$smoke/script.yml"

      - name: Build and run TurboAgent adapter against installed Praktor
        shell: bash
        run: |
          set -euxo pipefail
          consumer="$RUNNER_TEMP/turboagent-real-praktor"
          mkdir -p "$consumer"
          cat > "$consumer/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(turboagent_real_praktor LANGUAGES C)

          find_package(Praktor CONFIG REQUIRED)

          add_executable(turboagent_real_praktor
            "$ENV{GITHUB_WORKSPACE}/deps/turboagent/praktor_tools/src/turbo_praktor_tool_pack.c"
            "$ENV{GITHUB_WORKSPACE}/deps/turboagent/praktor_tools/tests/contract/mock_runtime.c"
            "$ENV{GITHUB_WORKSPACE}/deps/turboagent/praktor_tools/tests/contract/real_praktor_smoke.c"
          )
          target_compile_features(turboagent_real_praktor PRIVATE c_std_11)
          target_compile_definitions(turboagent_real_praktor PRIVATE
            _DEFAULT_SOURCE
            TURBO_PRAKTOR_CONTRACT_USE_REAL_PRAKTOR
          )
          target_compile_options(turboagent_real_praktor PRIVATE
            -Wall -Wextra -Werror -fvisibility=hidden
          )
          target_include_directories(turboagent_real_praktor PRIVATE
            "$ENV{GITHUB_WORKSPACE}/deps/turboagent/praktor_tools/include"
            "$ENV{GITHUB_WORKSPACE}/deps/turboagent/praktor_tools/tests/contract/include"
          )
          target_link_libraries(turboagent_real_praktor PRIVATE Praktor::Praktor)
          CMAKE

          export SALTS_ROOT=/opt/salts/debug
          export SALTS_UTILS_ROOT=/opt/salts-utils/debug
          export CMAKE_PREFIX_PATH="/opt/praktor/debug:/opt/chttp/debug:/opt/salts-utils/debug:/opt/salts/debug"
          cmake -S "$consumer" -B "$consumer/build" -G Ninja
          cmake --build "$consumer/build" -j2

          export LD_LIBRARY_PATH="/opt/praktor/debug/lib:/opt/chttp/debug/lib:/opt/salts-utils/debug/lib:/opt/salts/debug/lib:$GITHUB_WORKSPACE/vcpkg_installed/linux/x64-linux/debug/lib:$GITHUB_WORKSPACE/vcpkg_installed/linux/x64-linux/lib:$GITHUB_WORKSPACE/deps/salts/vcpkg_installed/linux/x64-linux/debug/lib:$GITHUB_WORKSPACE/deps/salts/vcpkg_installed/linux/x64-linux/lib:$GITHUB_WORKSPACE/deps/salts-utils/vcpkg_installed/linux/x64-linux/debug/lib:$GITHUB_WORKSPACE/deps/salts-utils/vcpkg_installed/linux/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          "$consumer/build/turboagent_real_praktor"

      - name: Upload core-only installed SDK
        uses: actions/upload-artifact@v4
        with:
          name: praktor-core-only-sdk-${{ github.sha }}
          retention-days: 14
          path: /opt/praktor/debug
          if-no-files-found: error

      - name: Verify tracked source remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
