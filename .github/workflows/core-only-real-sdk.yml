name: Core-only real SDK integration

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "ProjectOptions.cmake"
      - "cmake/**"
      - "praktor/**"
      - "actions/**"
      - "sdk/**"
      - "shared/**"
      - "vcpkg.json"
      - ".github/workflows/core-only-real-sdk.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: praktor-core-only-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TURBOAGENT_SHA: ebf99fd0944b07065055b3db641bcfc7f070c984
      CMAKE_BUILD_PARALLEL_LEVEL: 2

    steps:
      - name: Checkout exact Praktor head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - name: Restore shared re2c binary
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - name: Verify source identity
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code

      - name: Checkout exact TurboAgent Praktor adapter
        uses: actions/checkout@v4
        with:
          repository: qigao/TurboAgent
          ref: ${{ env.TURBOAGENT_SHA }}
          path: deps/turboagent
          persist-credentials: false

      - name: Prepare public toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm
          test -x "$VCPKG_ROOT/vcpkg"
          sudo mkdir -p /opt/salts /opt/salts-utils /opt/chttp /opt/praktor
          sudo chown -R "$USER":"$USER" /opt/salts /opt/salts-utils /opt/chttp /opt/praktor
          sudo ln -sfn "$VCPKG_ROOT" /opt/vcpkg


      - name: Restore current native SDK graph
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          sdk_root="$RUNNER_TEMP/praktor-core-native-sdks"
          mkdir -p "$sdk_root"

          restore_sdk() {
            local repo="$1"
            local pattern="$2"
            local name="$3"
            local config_rel="$4"
            local dir="$sdk_root/$name"
            local tag
            local nupkg
            tag="$(gh release view --repo "$repo" --json tagName --jq .tagName)"
            test -n "$tag"
            mkdir -p "$dir/download" "$dir/package"
            gh release download "$tag" --repo "$repo" --pattern "$pattern" \
              --dir "$dir/download" --clobber
            nupkg="$(find "$dir/download" -maxdepth 1 -type f -name '*.nupkg' -print -quit)"
            test -n "$nupkg"
            unzip -q "$nupkg" -d "$dir/package"
            local root="$dir/package/sdk/linux-x64"
            test -f "$root/$config_rel"
            printf '%s\n' "$root"
          }

          salts_root="$(restore_sdk qigao/salts 'Salts.Native.*.nupkg' salts 'lib/cmake/Salts/SaltsConfig.cmake')"
          utils_root="$(restore_sdk qigao/salts-utils 'SaltsUtils.Native.*.nupkg' salts-utils 'lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake')"
          chttp_root="$(restore_sdk qigao/chttp 'CHttp.Native.*.nupkg' chttp 'lib/cmake/Chttp/ChttpConfig.cmake')"

          ln -sfn "$salts_root" /opt/salts/debug
          ln -sfn "$utils_root" /opt/salts-utils/debug
          ln -sfn "$chttp_root" /opt/chttp/debug

          {
            echo "SALTS_ROOT=/opt/salts/debug"
            echo "SALTS_UTILS_ROOT=/opt/salts-utils/debug"
            echo "CHTTP_ROOT=/opt/chttp/debug"
          } >> "$GITHUB_ENV"

      - name: Configure real Praktor without TurboScript
        shell: bash
        env:
          SALTS_ROOT: /opt/salts/debug
          SALTS_UTILS_ROOT: /opt/salts-utils/debug
          CHTTP_ROOT: /opt/chttp/debug
        run: |
          set -euxo pipefail
          rm -rf build/linux-gcc-debug
          cmake --preset linux-dev-user             -DENABLE_SCRIPT_ENGINE=OFF             -DENABLE_TESTS=ON
          cache=build/linux-gcc-debug/CMakeCache.txt
          grep -F 'ENABLE_SCRIPT_ENGINE:BOOL=OFF' "$cache"
          if grep -F 'TurboScript_DIR' "$cache"; then
            echo "core-only configure unexpectedly resolved TurboScript" >&2
            exit 1
          fi

      - name: Build and run real core-only CTest
        shell: bash
        env:
          SALTS_ROOT: /opt/salts/debug
          SALTS_UTILS_ROOT: /opt/salts-utils/debug
          CHTTP_ROOT: /opt/chttp/debug
          LD_LIBRARY_PATH: /opt/chttp/debug/lib:/opt/salts-utils/debug/lib:/opt/salts/debug/lib
        run: |
          set -euxo pipefail
          cmake --build build/linux-gcc-debug -j2
          ctest --test-dir build/linux-gcc-debug --no-tests=error --output-on-failure

      - name: Install real core-only Praktor SDK
        shell: bash
        env:
          SALTS_ROOT: /opt/salts/debug
          SALTS_UTILS_ROOT: /opt/salts-utils/debug
          CHTTP_ROOT: /opt/chttp/debug
        run: |
          set -euxo pipefail
          cmake --build build/linux-gcc-debug --target install -j2
          config=/opt/praktor/debug/lib/cmake/Praktor/PraktorConfig.cmake
          test -f "$config"
          test -f /opt/praktor/debug/include/praktor.h
          grep -F 'if("OFF" STREQUAL "ON")' "$config"
          grep -F 'find_dependency(TurboScript 3.0.3 EXACT CONFIG' "$config"

      - name: Build installed-package ABI smoke
        shell: bash
        run: |
          set -euxo pipefail
          smoke="$RUNNER_TEMP/praktor-real-smoke"
          mkdir -p "$smoke"
          cat > "$smoke/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(praktor_real_smoke LANGUAGES C)
          find_package(Praktor CONFIG REQUIRED)
          add_executable(praktor_real_smoke main.c)
          target_link_libraries(praktor_real_smoke PRIVATE Praktor::Praktor)
          CMAKE
          cat > "$smoke/main.c" <<'C'
          #include <praktor.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>

          static int run_one(const char *path, int expect_success, const char *needle) {
            praktor_execute_request request = PRAKTOR_EXECUTE_REQUEST_INIT;
            praktor_owned_json output = PRAKTOR_OWNED_JSON_INIT;
            praktor_error error = PRAKTOR_ERROR_INIT;
            praktor_result result;

            request.workflow_path = path;
            request.input_json = "{}";
            request.input_json_size = 2;
            result = praktor_execute_workflow(&request, &output, &error);

            if (expect_success) {
              if (result != PRAKTOR_RESULT_SUCCESS) {
                fprintf(stderr, "expected success, got %d: %s\n", (int)result, error.message);
                praktor_release_json(&output);
                return 1;
              }
            } else if (result != PRAKTOR_RESULT_EXECUTION_FAILED) {
              fprintf(stderr, "expected workflow failure, got %d: %s\n", (int)result, error.message);
              praktor_release_json(&output);
              return 1;
            }

            if (!output.data || !strstr(output.data, needle)) {
              fprintf(stderr, "missing result evidence: %s\n", needle);
              if (output.data) fprintf(stderr, "%s\n", output.data);
              praktor_release_json(&output);
              return 1;
            }
            praktor_release_json(&output);
            return 0;
          }

          int main(int argc, char **argv) {
            const praktor_api *api = praktor_get_api();
            if (argc != 3) return 2;
            if (!api) return 3;
            if ((api->capabilities & PRAKTOR_CAPABILITY_JSON_WORKFLOW) == 0) return 4;
            if ((api->capabilities & PRAKTOR_CAPABILITY_SCRIPT_ENGINE) != 0) return 5;
            if ((api->capabilities & PRAKTOR_CAPABILITY_EXECUTION_CONTROL) == 0) return 6;
            if (api->abi_major != PRAKTOR_ABI_MAJOR || api->abi_minor < 1) return 7;
            if (!api->execute_workflow_controlled) return 8;
            if (run_one(argv[1], 1, "success") != 0) return 9;
            if (run_one(argv[2], 0, "ENABLE_SCRIPT_ENGINE=OFF") != 0) return 10;
            puts("PRAKTOR_CORE_ONLY_REAL_ABI_OK");
            return 0;
          }
          C
          cat > "$smoke/command.yml" <<'YAML'
          tasks:
            - name: command_ok
              command: "printf praktor-core-only-ok"
          YAML
          cat > "$smoke/script.yml" <<'YAML'
          tasks:
            - name: script_rejected
              script: |
                ctx.output("unexpected", true);
          YAML

          export SALTS_ROOT=/opt/salts/debug
          export SALTS_UTILS_ROOT=/opt/salts-utils/debug
          export CMAKE_PREFIX_PATH="/opt/praktor/debug:/opt/chttp/debug:/opt/salts-utils/debug:/opt/salts/debug"
          cmake -S "$smoke" -B "$smoke/build" -G Ninja
          cmake --build "$smoke/build" --verbose -j2

          export LD_LIBRARY_PATH="/opt/praktor/debug/lib:/opt/chttp/debug/lib:/opt/salts-utils/debug/lib:/opt/salts/debug/lib:$GITHUB_WORKSPACE/vcpkg_installed/linux/x64-linux/debug/lib:$GITHUB_WORKSPACE/vcpkg_installed/linux/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          "$smoke/build/praktor_real_smoke" "$smoke/command.yml" "$smoke/script.yml"

      - name: Build and run TurboAgent adapter against installed Praktor
        shell: bash
        run: |
          set -euxo pipefail
          consumer="$RUNNER_TEMP/turboagent-real-praktor"
          mkdir -p "$consumer"
          cat > "$consumer/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(turboagent_real_praktor LANGUAGES C)

          find_package(Praktor CONFIG REQUIRED)

          add_executable(turboagent_real_praktor
            "$ENV{GITHUB_WORKSPACE}/deps/turboagent/praktor_tools/src/turbo_praktor_tool_pack.c"
            "$ENV{GITHUB_WORKSPACE}/deps/turboagent/praktor_tools/tests/contract/mock_runtime.c"
            "$ENV{GITHUB_WORKSPACE}/deps/turboagent/praktor_tools/tests/contract/real_praktor_smoke.c"
          )
          target_compile_features(turboagent_real_praktor PRIVATE c_std_11)
          target_compile_definitions(turboagent_real_praktor PRIVATE
            _DEFAULT_SOURCE
            TURBO_PRAKTOR_CONTRACT_USE_REAL_PRAKTOR
          )
          target_compile_options(turboagent_real_praktor PRIVATE
            -Wall -Wextra -Werror -fvisibility=hidden
          )
          target_include_directories(turboagent_real_praktor PRIVATE
            "$ENV{GITHUB_WORKSPACE}/deps/turboagent/praktor_tools/include"
            "$ENV{GITHUB_WORKSPACE}/deps/turboagent/praktor_tools/tests/contract/include"
          )
          target_link_libraries(turboagent_real_praktor PRIVATE Praktor::Praktor)
          CMAKE

          export SALTS_ROOT=/opt/salts/debug
          export SALTS_UTILS_ROOT=/opt/salts-utils/debug
          export CMAKE_PREFIX_PATH="/opt/praktor/debug:/opt/chttp/debug:/opt/salts-utils/debug:/opt/salts/debug"
          cmake -S "$consumer" -B "$consumer/build" -G Ninja
          cmake --build "$consumer/build" --verbose -j2

          export LD_LIBRARY_PATH="/opt/praktor/debug/lib:/opt/chttp/debug/lib:/opt/salts-utils/debug/lib:/opt/salts/debug/lib:$GITHUB_WORKSPACE/vcpkg_installed/linux/x64-linux/debug/lib:$GITHUB_WORKSPACE/vcpkg_installed/linux/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          "$consumer/build/turboagent_real_praktor"

      - name: Verify tracked source remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
