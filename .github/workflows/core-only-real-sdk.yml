name: Core-only real SDK integration

on:
  workflow_dispatch:
    inputs:
      salts_utils_ref:
        description: SaltsUtils candidate revision exporting Salts::YamlParser and Salts::BehaviorTree
        type: string
        default: 779705d76ae173d1b5d18ad1de10ee88c086452c
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "CMakeUserPresets.json"
      - "CMakePresets.json"
      - "presets/**"
      - "packaging/nuget/Praktor.Native.csproj"
      - "ProjectOptions.cmake"
      - "cmake/**"
      - "praktor/**"
      - "actions/**"
      - "sdk/**"
      - "shared/**"
      - "schema/**"
      - "grammar.schema.json"
      - "tools/**"
      - "vcpkg.json"
      - ".github/workflows/core-only-real-sdk.yml"
      - ".github/workflows/c11-source-tsan.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: praktor-core-only-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  integration:
    name: ${{ matrix.rid }} / ${{ matrix.sdk }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows, macos]
        sdk: [rc11, yaml-parser, behavior-tree]
        include:
          - {platform: linux, runner: ubuntu-24.04, rid: linux-x64, triplet: x64-linux, preset: ci-linux-sdk, producer: ci-sdk-release-user}
          - {platform: windows, runner: windows-2025, rid: windows-x64, triplet: x64-windows, preset: ci-windows-sdk, producer: ci-win-sdk-release-user}
          - {platform: macos, runner: macos-15, rid: macos-arm64, triplet: arm64-osx, preset: ci-macos-sdk, producer: ci-sdk-release-user}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RID: ${{ matrix.rid }}
      TRIPLET: ${{ matrix.triplet }}
      HOST_TRIPLET: ${{ matrix.triplet }}
      CMAKE_PRESET: ${{ matrix.preset }}
      SDK_VARIANT: ${{ matrix.sdk }}
      PRODUCER_PRESET: ${{ matrix.producer }}
      SALTS_UTILS_SOURCE_REF: ${{ inputs.salts_utils_ref || '779705d76ae173d1b5d18ad1de10ee88c086452c' }}
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/cache/restore@v4
        id: ccache
        with:
          path: ${{ env.CCACHE_DIR }}
          key: praktor-ccache-v1-${{ matrix.rid }}-release-core-${{ matrix.sdk }}-${{ hashFiles('CMakeUserPresets.json', 'vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            praktor-ccache-v1-${{ matrix.rid }}-release-core-${{ matrix.sdk }}-${{ hashFiles('CMakeUserPresets.json', 'vcpkg.json') }}-

      - name: Prepare Unix tools
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y ccache ninja-build pkg-config nasm libudev-dev
          else
            brew install ccache ninja nasm autoconf automake autoconf-archive libtool
            test "$(uname -m)" = arm64
          fi

      - name: Prepare Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ccache ninja nasm --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Tool installation failed' }
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC installation was not found' }
          if (-not $env:QIGAO_VCPKG_WINDOWS_TRIPLET) { throw 'Shared cache did not select a Windows triplet' }
          "VSINSTALL=$vs" >> $env:GITHUB_ENV
          "TRIPLET=$env:QIGAO_VCPKG_WINDOWS_TRIPLET" >> $env:GITHUB_ENV
          "HOST_TRIPLET=$env:QIGAO_VCPKG_WINDOWS_TRIPLET" >> $env:GITHUB_ENV
          "QIGAO_VCPKG_ROOT=$env:VCPKG_ROOT" >> $env:GITHUB_ENV

      - name: Reset compiler cache statistics
        shell: pwsh
        run: ccache --zero-stats

      - name: Restore published core SDK baseline
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/RestoreNativeSdks.ps1 -Rid $env:RID -CoreOnly -SaltsUtilsVersion 4.3.0-rc.11

      - name: Checkout candidate SaltsUtils SDK source
        if: matrix.sdk != 'rc11'
        uses: actions/checkout@v4
        with:
          repository: qigao/salts-utils
          ref: ${{ env.SALTS_UTILS_SOURCE_REF }}
          path: build/salts-utils-source
          persist-credentials: false

      - name: Select candidate SDK build environment
        if: matrix.sdk != 'rc11'
        shell: pwsh
        run: |
          "QIGAO_SDK_RID=$env:RID" >> $env:GITHUB_ENV
          "QIGAO_TARGET_TRIPLET=$env:TRIPLET" >> $env:GITHUB_ENV

      - name: Build candidate SDK on Unix
        if: matrix.sdk != 'rc11' && runner.os != 'Windows'
        working-directory: build/salts-utils-source
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset "$PRODUCER_PRESET"
          cmake --build --preset "$PRODUCER_PRESET" --parallel 2
          cmake --build --preset "install-$PRODUCER_PRESET" --parallel 2

      - name: Build candidate SDK on Windows
        if: matrix.sdk != 'rc11' && runner.os == 'Windows'
        working-directory: build/salts-utils-source
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          cmake --preset "%PRODUCER_PRESET%"
          if errorlevel 1 exit /b 1
          cmake --build --preset "%PRODUCER_PRESET%" --parallel 2
          if errorlevel 1 exit /b 1
          cmake --build --preset "install-%PRODUCER_PRESET%" --parallel 2
          if errorlevel 1 exit /b 1

      - name: Select installed SaltsUtils candidate
        if: matrix.sdk != 'rc11'
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "build/salts-utils-source/stage/sdk/$env:RID"
          "SALTS_UTILS_ROOT=$root" >> $env:GITHUB_ENV

      - name: Build and test core-only SDK on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SDK_VARIANT" == behavior-tree ]]; then
            cmake --preset "$CMAKE_PRESET" -DENABLE_SCRIPT_ENGINE=OFF -DPRAKTOR_ENABLE_C11_ACTIONS=ON
          else
            cmake --preset "$CMAKE_PRESET" -DENABLE_SCRIPT_ENGINE=OFF
          fi
          cmake --build --preset "$CMAKE_PRESET" --parallel 2
          ctest --preset "$CMAKE_PRESET" --output-on-failure --output-junit build/ci-sdk/ctest.xml
          cmake --build --preset "install-$CMAKE_PRESET" --parallel 2

      - name: Build and test core-only SDK on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          if "%SDK_VARIANT%"=="behavior-tree" (
            cmake --preset "%CMAKE_PRESET%" -DENABLE_SCRIPT_ENGINE=OFF -DPRAKTOR_ENABLE_C11_ACTIONS=ON
          ) else (
            cmake --preset "%CMAKE_PRESET%" -DENABLE_SCRIPT_ENGINE=OFF
          )
          if errorlevel 1 exit /b 1
          cmake --build --preset "%CMAKE_PRESET%" --parallel 2
          if errorlevel 1 exit /b 1
          ctest --preset "%CMAKE_PRESET%" --output-on-failure --output-junit build/ci-sdk/ctest.xml
          if errorlevel 1 exit /b 1
          cmake --build --preset "install-%CMAKE_PRESET%" --parallel 2
          if errorlevel 1 exit /b 1

      - name: Audit that Shell uses the C11 Process owner
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 cmake/ci/audit-process-adapter.py build/ci-sdk/shared/shell/libpraktor_shell.a \
            build/ci-sdk/shared/process/libpraktor_process_driver.a

      # Independent C-only project, with no C++ compiler or actions library.
      - name: C11 BehaviorTree adapter standalone C-only link
        if: matrix.platform == 'linux' && matrix.sdk == 'behavior-tree'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S actions/c11/standalone -B build/ci-c11-standalone -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ci-c11-standalone --parallel 2
          ctest --test-dir build/ci-c11-standalone \
            --no-tests=error --output-on-failure \
            -R '^actions_c11_(tree_adapter|value_store|native_host)_standalone_test$'

      - name: C11 Process standalone without a C++ runtime
        if: matrix.platform == 'linux' && matrix.sdk == 'behavior-tree'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S shared/process/standalone -B build/ci-process-c -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ci-process-c --parallel 2
          python3 cmake/ci/audit-c11-runtime-link.py build/ci-process-c/praktor_process_driver_test
          ctest --test-dir build/ci-process-c --no-tests=error --output-on-failure

      - name: C11 Session without a C++ compiler or runtime
        if: matrix.platform == 'linux' && matrix.sdk == 'behavior-tree'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S actions/c11/session-c-standalone -B build/ci-session-c -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ci-session-c --parallel 2
          python3 cmake/ci/audit-c11-runtime-link.py build/ci-session-c/actions_c11_session_c_test
          ctest --test-dir build/ci-session-c --no-tests=error --output-on-failure

      - name: Independent Session link and run without legacy targets
        if: matrix.platform == 'linux' && matrix.sdk == 'behavior-tree'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S actions/c11/session-standalone -B build/ci-session-standalone -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ci-session-standalone --parallel 2
          python3 cmake/ci/audit-c11-session-link.py \
            build/ci-session-standalone/actions_c11_session_independent_test
          ctest --test-dir build/ci-session-standalone --no-tests=error --output-on-failure

      # Source-instrument the opt-in C11 consumer without multiplying the
      # nine-platform SDK matrix. The complete real WorkflowRunner TSan gate
      # is in c11-source-tsan.yml with *fully instrumented* Salts + SaltsUtils.
      # This job uses released Salts (mixed instrumentation) and cannot
      # attest its async logger's release/acquire synchronization.
      - name: C11 Process lifecycle ASan and UBSan
        if: matrix.platform == 'linux' && matrix.sdk == 'behavior-tree'
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: bash cmake/ci/qualify-c11-lifetime-sanitizers.sh address

      - name: C11 Session consumer-only TSan smoke
        if: matrix.platform == 'linux' && matrix.sdk == 'behavior-tree'
        shell: bash
        env:
          TSAN_OPTIONS: halt_on_error=1:history_size=7
        run: bash cmake/ci/qualify-c11-lifetime-sanitizers.sh thread

      - name: Report compiler cache statistics
        if: always()
        shell: pwsh
        run: |
          if (Get-Command ccache -ErrorAction SilentlyContinue) { ccache --show-stats }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-diagnostics-${{ matrix.rid }}-${{ matrix.sdk }}
          path: |
            build/ci-session-standalone/Testing/Temporary/LastTest.log
            build/ci-session-c/Testing/Temporary/LastTest.log
            build/ci-sdk/ctest.xml
            build/ci-sdk/Testing/Temporary/LastTest.log
            build/ci-c11-address/Testing/Temporary/LastTest.log
            build/ci-c11-thread/Testing/Temporary/LastTest.log
            build/ci-sdk/CMakeFiles/CMakeConfigureLog.yaml
            build/salts-utils-source/build/ci-sdk/**/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

      - uses: actions/cache/save@v4
        if: always() && steps.ccache.outcome == 'success' && steps.ccache.outputs.cache-primary-key != steps.ccache.outputs.cache-matched-key
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache.outputs.cache-primary-key }}
