name: Praktor native SDK

on:
  workflow_dispatch:
    inputs:
      turboscript_ci_run:
        description: Successful TurboScript SDK workflow run to qualify (blank uses the released package)
        type: string
        default: ""
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "CMakeUserPresets.json"
      - "CMakePresets.json"
      - "presets/**"
      - "cmake/**"
      - "praktor/**"
      - "actions/**"
      - "sdk/**"
      - "shared/**"
      - "tools/**"
      - "schema/**"
      - "grammar.schema.json"
      - "vcpkg.json"
      - "packaging/nuget/**"
      - ".github/actions/setup-native-ci/**"
      - ".github/workflows/native-sdk-release.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: read

concurrency:
  group: praktor-native-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import re
          from pathlib import Path
          s = Path("CMakeLists.txt").read_text()
          print(".".join(re.search(r"set\(CMAKE_PROJECT_VERSION_" + part + r"\s+(\d+)\)", s).group(1)
                         for part in ("MAJOR", "MINOR", "PATCH")))
          PY
          )"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          vcpkg_version="$(python3 -c 'import json; print(json.load(open("vcpkg.json", encoding="utf-8"))["version-semver"])')"
          test "$vcpkg_version" = "$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "version=$version-ci.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, rid: linux-x64, triplet: x64-linux, host: x64-linux, preset: ci-linux-sdk}
          - {runner: macos-15, rid: macos-arm64, triplet: arm64-osx, host: arm64-osx, preset: ci-macos-sdk}
          - {runner: ubuntu-24.04, rid: android-arm64-v8a, triplet: arm64-android, host: x64-linux, preset: ci-android-sdk}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RID: ${{ matrix.rid }}
      TRIPLET: ${{ matrix.triplet }}
      HOST_TRIPLET: ${{ matrix.host }}
      CMAKE_PRESET: ${{ matrix.preset }}
      SDK_VERSION: ${{ needs.metadata.outputs.version }}
      # C11 migration PRs must validate against the exact 3.0.11 producer artifact.
      # Keep the override branch-scoped; unrelated PRs continue using released packages.
      TURBOSCRIPT_CI_RUN: ${{ inputs.turboscript_ci_run || (github.event_name == 'pull_request' && (github.head_ref == 'feat/praktor-c11-behavior-tree-adapter' || github.head_ref == 'refactor/praktor-c-only') && '38529473245') || '' }}
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-native-ci

      - name: Prepare tools
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y ccache ninja-build pkg-config nasm
          else
            brew install ccache ninja nasm
          fi
          if [[ "$RID" == macos-arm64 ]]; then test "$(uname -m)" = arm64; fi

      - uses: actions/cache/restore@v4
        id: ccache
        with:
          path: ${{ env.CCACHE_DIR }}
          key: praktor-ccache-v1-${{ matrix.rid }}-release-script-${{ hashFiles('CMakeUserPresets.json', 'vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            praktor-ccache-v1-${{ matrix.rid }}-release-script-${{ hashFiles('CMakeUserPresets.json', 'vcpkg.json') }}-

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      - name: Download released native SDK dependencies with curl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: python cmake/ci/github_packages.py sdks --rid "$RID" --packages build/native-sdk/packages

      - name: Report resolved native SDK baseline
        shell: bash
        run: |
          set -euo pipefail
          printf 'Salts.Native=%s\n' "$SALTS_NATIVE_VERSION"
          printf 'SaltsUtils.Native=%s\n' "$SALTS_UTILS_NATIVE_VERSION"
          printf 'CHttp.Native=%s\n' "$CHTTP_NATIVE_VERSION"
          printf 'TurboScript.Native=%s\n' "$TURBOSCRIPT_NATIVE_VERSION"

      - name: Check candidate SDK provenance
        if: env.TURBOSCRIPT_CI_RUN != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ env.TURBOSCRIPT_CI_RUN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/qigao/TurboScript/actions/runs/$CANDIDATE_RUN" > "$RUNNER_TEMP/turboscript-run.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads((Path(os.environ['RUNNER_TEMP']) / 'turboscript-run.json').read_text())
          if (run['status'] != 'completed' or run['conclusion'] != 'success'
                  or run['path'] != '.github/workflows/native-sdk-release.yml'):
              raise SystemExit('Candidate must come from a successful TurboScript native SDK workflow')
          print(f"Candidate TurboScript source: {run['head_sha']} ({run['html_url']})")
          PY

      - uses: actions/download-artifact@v4
        if: env.TURBOSCRIPT_CI_RUN != ''
        with:
          repository: qigao/TurboScript
          run-id: ${{ env.TURBOSCRIPT_CI_RUN }}
          github-token: ${{ github.token }}
          name: turboscript-sdk-${{ matrix.rid }}
          path: build/turboscript-candidate

      - name: Select candidate SDK
        if: env.TURBOSCRIPT_CI_RUN != ''
        env:
          CANDIDATE_RUN: ${{ env.TURBOSCRIPT_CI_RUN }}
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/build/turboscript-candidate"
          tar -xzf "$root/turboscript-$RID.tar.gz" -C "$root"
          test -f "$root/$RID/lib/cmake/TurboScript/TurboScriptConfig.cmake"
          echo "TURBOSCRIPT_ROOT=$root/$RID" >> "$GITHUB_ENV"
          echo "TURBOSCRIPT_NATIVE_VERSION=ci-run-$CANDIDATE_RUN" >> "$GITHUB_ENV"
          cat "$root/$RID/turboscript-sdk-manifest.txt"

      - name: Build script-enabled Praktor SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RID" == android-arm64-v8a ]]; then
            mkdir -p build/host
            cc tools/lemon/lemon.c -o build/host/lemon
            export PRAKTOR_HOST_LEMON_EXECUTABLE="$GITHUB_WORKSPACE/build/host/lemon"
          fi
          cmake --preset "$CMAKE_PRESET"
          cmake --build --preset "$CMAKE_PRESET" --parallel 2
          if [[ "$RID" != android-arm64-v8a ]]; then
            ctest --preset "$CMAKE_PRESET" --output-on-failure
          fi
          cmake --build --preset "install-$CMAKE_PRESET"
          cat > "stage/$RID/praktor-sdk-manifest.txt" <<EOF
          version=$SDK_VERSION
          commit=$(git rev-parse HEAD)
          rid=$RID
          profile=Release
          script_engine=ON
          turboscript=$TURBOSCRIPT_NATIVE_VERSION
          chttp=$CHTTP_NATIVE_VERSION
          salts=$SALTS_NATIVE_VERSION
          salts_utils=$SALTS_UTILS_NATIVE_VERSION
          EOF
          mkdir -p dist
          tar -chzf "dist/praktor-$RID.tar.gz" -C stage "$RID"

      - name: Report compiler cache statistics
        if: always()
        shell: bash
        run: |
          if command -v ccache >/dev/null; then ccache --show-stats; fi

      - name: Upload curl cache diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-curl-cache-${{ matrix.rid }}
          path: ${{ runner.temp }}/praktor-curl-cache.log
          if-no-files-found: ignore

      - uses: actions/cache/save@v4
        if: always() && steps.ccache.outcome == 'success' && steps.ccache.outputs.cache-primary-key != steps.ccache.outputs.cache-matched-key
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        with:
          name: praktor-sdk-${{ matrix.rid }}
          path: dist/*.tar.gz
          retention-days: 1
          if-no-files-found: error

  pack:
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: praktor-sdk-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Pack tested SDK artifacts
        env:
          SDK_VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/sdk
          for rid in linux-x64 macos-arm64 android-arm64-v8a; do
            tar -xzf "dist/praktor-$rid.tar.gz" -C package/sdk
            test -f "package/sdk/$rid/lib/cmake/Praktor/PraktorConfig.cmake"
          done
          test "$(sed -n 's/^commit=//p' package/sdk/*/praktor-sdk-manifest.txt | sort -u | wc -l)" -eq 1

          # Packing consumes only the tested SDK artifacts. No native packages
          # or cache toolchain are restored in this job.
          dotnet restore packaging/nuget/Praktor.Native.csproj \
            --configfile cmake/ci/empty-nuget.config -p:RestoreNativeDependencies=False
          dotnet pack packaging/nuget/Praktor.Native.csproj --no-restore --configuration Release --output dist \
            "-p:PackageVersion=$SDK_VERSION" "-p:PackageRoot=$GITHUB_WORKSPACE/package" \
            -p:RestoreNativeDependencies=False

          package="dist/Praktor.Native.$SDK_VERSION.nupkg"
          nuspec="$RUNNER_TEMP/Praktor.Native.nuspec"
          unzip -p "$package" 'Praktor.Native.nuspec' > "$nuspec"
          if grep -E 'id="(Salts\.Native|SaltsUtils\.Native|CHttp\.Native|TurboScript\.Native)"' "$nuspec"; then
            echo "Praktor.Native must not publish versioned GitHub package dependency metadata" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: praktor-native-nuget
          path: dist/*.nupkg
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [metadata, pack]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: praktor-native-nuget
          path: dist
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish qualified package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDK_VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json --name github \
            --username qigao --password "$GITHUB_TOKEN" --store-password-in-clear-text
          dotnet nuget push "dist/Praktor.Native.$SDK_VERSION.nupkg" \
            --source github --api-key "$GITHUB_TOKEN"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDK_VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$SDK_VERSION"
          pkg="dist/Praktor.Native.$SDK_VERSION.nupkg"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$pkg" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$pkg" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Praktor $SDK_VERSION" --generate-notes
          fi
