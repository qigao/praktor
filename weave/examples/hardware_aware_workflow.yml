# Hardware-Aware Workflow Example
# This workflow demonstrates the new libuv-based system information capabilities

name: "Hardware-Aware Build Pipeline"

defaults:
  vars:
    MIN_MEMORY_GB: "4"
    MIN_CPU_CORES: "2"
    MAX_LOAD_THRESHOLD: "2.0"

variables:
  PROJECT_NAME: "MyApplication"
  BUILD_TYPE: "release"

tasks:
  - name: system_info_report
    type: run_command
    command: |
      echo "=== System Information Report ==="
      echo "OS: {{WEAVE_OS_NAME}} {{WEAVE_OS_VERSION}}"
      echo "Architecture: {{WEAVE_ARCH}}"
      echo "CPU: {{WEAVE_CPU_MODEL}} ({{WEAVE_CPU_CORES}} cores @ {{WEAVE_CPU_SPEED_MHZ}} MHz)"
      echo "Memory: {{WEAVE_MEMORY_TOTAL_GB}} GB total, {{WEAVE_MEMORY_FREE_GB}} GB free"
      echo "Load Average: {{WEAVE_LOAD_1MIN}} (1min), {{WEAVE_LOAD_5MIN}} (5min), {{WEAVE_LOAD_15MIN}} (15min)"
      echo "Network Interfaces: {{WEAVE_NETWORK_INTERFACES}}"
      echo "User: {{WEAVE_USER}}@{{WEAVE_HOST}}"
      echo "Shell: {{WEAVE_SHELL}}"
      echo "================================="

  - name: validate_system_requirements
    type: run_command
    depends_on: [system_info_report]
    command: |
      echo "Validating system requirements..."
      echo "Required: {{MIN_CPU_CORES}} cores, {{MIN_MEMORY_GB}} GB RAM"
      echo "Available: {{WEAVE_CPU_CORES}} cores, {{WEAVE_MEMORY_TOTAL_GB}} GB RAM"
      echo "Current load: {{WEAVE_LOAD_1MIN}}"
    when: "{{WEAVE_CPU_CORES}} >= {{MIN_CPU_CORES}} and {{WEAVE_MEMORY_TOTAL_GB}} >= {{MIN_MEMORY_GB}}"

  - name: wait_for_low_load
    type: run_command
    depends_on: [validate_system_requirements]
    command: |
      echo "System load is acceptable: {{WEAVE_LOAD_1MIN}}"
      echo "Proceeding with resource-intensive tasks..."
    when: "{{WEAVE_LOAD_1MIN}} <= {{MAX_LOAD_THRESHOLD}}"
    retries:
      count: 5
      delay: "30s"

  - name: parallel_build
    type: parallel
    depends_on: [wait_for_low_load]
    # Use all available CPU cores for parallel builds
    tasks:
      - name: build_frontend
        type: run_command
        command: |
          echo "Building frontend on {{WEAVE_CPU_CORES}}-core system..."
          echo "Using {{WEAVE_CPU_CORES}} parallel jobs"
          # npm run build -- --max-workers={{WEAVE_CPU_CORES}}
          echo "Frontend build completed"

      - name: build_backend
        type: run_command
        command: |
          echo "Building backend with Go..."
          echo "GOMAXPROCS will use {{WEAVE_CPU_CORES}} cores"
          # go build -parallel={{WEAVE_CPU_CORES}} ./...
          echo "Backend build completed"

      - name: run_tests
        type: run_command
        command: |
          echo "Running tests with optimal parallelism..."
          echo "Test parallelism: {{WEAVE_CPU_CORES}}"
          # pytest -n {{WEAVE_CPU_CORES}}
          echo "Tests completed"

  - name: memory_intensive_task
    type: run_command
    depends_on: [parallel_build]
    command: |
      echo "Running memory-intensive task..."
      echo "Available memory: {{WEAVE_MEMORY_FREE_GB}} GB"
      echo "Task will use up to 50% of available memory"
      # docker run --memory={{WEAVE_MEMORY_FREE_GB}}g/2 memory-intensive-app
      echo "Memory-intensive task completed"
    when: "{{WEAVE_MEMORY_FREE_GB}} >= 2"  # Only run if we have at least 2GB free

  - name: network_deployment
    type: run_command
    depends_on: [memory_intensive_task]
    command: |
      echo "Deploying application..."
      echo "Network interfaces available: {{WEAVE_NETWORK_INTERFACES}}"
      echo "Deploying from {{WEAVE_USER}}@{{WEAVE_HOST}}"
      # kubectl apply -f deployment.yaml
      echo "Deployment completed"
    when: "{{WEAVE_NETWORK_INTERFACES}} > 1"  # Ensure we have network connectivity

  - name: performance_report
    type: run_command
    depends_on: [network_deployment]
    command: |
      echo "=== Build Performance Report ==="
      echo "System: {{WEAVE_OS_NAME}} {{WEAVE_ARCH}}"
      echo "CPU Utilization: {{WEAVE_CPU_CORES}} cores @ {{WEAVE_CPU_SPEED_MHZ}} MHz"
      echo "Memory Usage: {{WEAVE_MEMORY_TOTAL_GB}} GB total"
      echo "Final Load: {{WEAVE_LOAD_1MIN}}"
      echo "Build completed successfully on {{WEAVE_HOST}}"
      echo "==============================="

  # Failure handling with system context
  - name: system_cleanup
    type: run_command
    command: |
      echo "Cleaning up after failure on {{WEAVE_HOST}}"
      echo "System load at failure: {{WEAVE_LOAD_1MIN}}"
      echo "Available memory: {{WEAVE_MEMORY_FREE_GB}} GB"
      echo "Failed task: {{failed_task_name}}"
      echo "Error: {{failed_task_error}}"
      # Clean up resources, send alerts, etc.
    on_failure: [validate_system_requirements, parallel_build, memory_intensive_task]
