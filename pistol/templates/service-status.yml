name: Service Status
description: |
  Queries whether a named service is running.
  Uses native service managers where available and falls back to process lookup.

variables:
  SERVICE_NAME: ""

tasks:
  - name: validate_request
    script: |
      var serviceName = ctx.get("SERVICE_NAME");
      if (serviceName == "") {
        fail("SERVICE_NAME is required");
      }

  - name: query_status
    depends_on: [validate_request]
    fallback:
      - shell:
          cmd: "powershell -NoProfile -Command \"if (Get-Command Get-Service -ErrorAction SilentlyContinue) { (Get-Service -Name '{{ SERVICE_NAME }}' -ErrorAction Stop).Status } elseif (Get-Command systemctl -ErrorAction SilentlyContinue) { systemctl is-active '{{ SERVICE_NAME }}' } else { Get-Process -Name '{{ SERVICE_NAME }}' -ErrorAction Stop | Select-Object -First 1 -ExpandProperty Id }\""
          output_key: status_raw
      - shell:
          cmd: "if command -v systemctl >/dev/null 2>&1; then systemctl is-active '{{ SERVICE_NAME }}'; elif command -v service >/dev/null 2>&1; then service '{{ SERVICE_NAME }}' status; else pgrep -x '{{ SERVICE_NAME }}' | head -n 1; fi"
          output_key: status_raw
    continue_on_error: true

  - name: emit_result
    depends_on: [query_status]
    script: |
      var running = ctx.get("tasks.query_status.status") != "failed";
      var statusValue = "stopped";
      if (running) {
        statusValue = "running";
      }
      var runningStr = "false";
      if (running) {
        runningStr = "true";
      }
      var jsonStr = "{\"service\":" + json.stringify(ctx.get("SERVICE_NAME")) + ", \"running\":" + runningStr + ", \"raw\":" + json.stringify(ctx.get("tasks.query_status.outputs.status_raw")) + ", \"status\":" + json.stringify(statusValue) + "}";
      ctx.output("result", jsonStr);
      log.info("Service status: " + jsonStr);
