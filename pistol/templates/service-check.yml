name: Service Health Check
description: |
  Reusable workflow for ensuring a single service is alive.
  Called via `uses` with vars:
    SERVICE_NAME   Required process/service name
    CHECK_CMD      Optional explicit liveness command
    RESTART_CMD    Optional restart command

  Behavior:
    1. Try the liveness check
    2. If it fails and RESTART_CMD is provided, restart and verify once
    3. Emit a structured status object

variables:
  SERVICE_NAME: ""
  CHECK_CMD: ""
  RESTART_CMD: ""

tasks:
  - name: ensure_service
    fallback:
      - sequence:
          - shell:
              cmd: "{{ CHECK_CMD || ('pgrep -x ' + SERVICE_NAME + ' || tasklist /FI \"IMAGENAME eq ' + SERVICE_NAME + '.exe\" /NH 2>nul | findstr /I \"' + SERVICE_NAME + '\"') }}"
              output_key: alive_raw
          - parse_regex:
              input_key: alive_raw
              pattern: "([A-Za-z0-9._-]+|[0-9]+)"
              capture_group: 1
              output_key: alive_pid
      - sequence:
          - shell:
              cmd: "{{ RESTART_CMD || 'exit 1' }}"
          - shell:
              cmd: "{{ CHECK_CMD || ('pgrep -x ' + SERVICE_NAME + ' || tasklist /FI \"IMAGENAME eq ' + SERVICE_NAME + '.exe\" /NH 2>nul | findstr /I \"' + SERVICE_NAME + '\"') }}"
              output_key: restarted_raw
          - parse_regex:
              input_key: restarted_raw
              pattern: "([A-Za-z0-9._-]+|[0-9]+)"
              capture_group: 1
              output_key: restarted_pid
    continue_on_error: true

  - name: emit_status
    depends_on: [ensure_service]
    script: |
      var alive_pid = ctx.get("tasks.ensure_service.outputs.alive_pid");
      var restarted_pid = ctx.get("tasks.ensure_service.outputs.restarted_pid");
      var status = {
        "service": ctx.get("SERVICE_NAME"),
        "alive": false,
        "restarted": false,
        "pid": "",
        "status": "down"
      };

      if alive_pid {
        status.alive = true;
        status.pid = alive_pid;
        status.status = "alive";
      } else if restarted_pid {
        status.alive = true;
        status.restarted = true;
        status.pid = restarted_pid;
        status.status = "restarted";
      }

      ctx.output("service_status", status);
      if not status.alive {
        fail("Service '" + status.service + "' is not running");
      }
