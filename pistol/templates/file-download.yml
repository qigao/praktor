name: File Download
description: |
  Downloads a single file to a local destination.

  Variables:
    URL         Required source URL
    DST_PATH    Required destination path
    CHECKSUM    Optional SHA-256 checksum for verification
    OVERWRITE   Whether to overwrite an existing destination (true|false)

  Behavior:
    1. Validate inputs
    2. Refuse to clobber the destination unless OVERWRITE=true
    3. Download to a temporary file
    4. Optionally verify SHA-256
    5. Atomically move into place

variables:
  URL: ""
  DST_PATH: ""
  CHECKSUM: ""
  OVERWRITE: "false"

tasks:
  - name: validate_request
    script: |
      var downloadUrl = ctx.get("URL");
      var destinationPath = ctx.get("DST_PATH");
      var overwriteFlag = ctx.get("OVERWRITE");

      if (len(downloadUrl) == 0) {
        fail("URL is required");
      }
      if (len(destinationPath) == 0) {
        fail("DST_PATH is required");
      }
      if (overwriteFlag != "true" && overwriteFlag != "false") {
        fail("OVERWRITE must be 'true' or 'false'");
      }

  - name: inspect_destination
    depends_on: [validate_request]
    file_exists:
      path: "{{ DST_PATH }}"
      output_key: destination_exists
      fail_if_missing: false

  - name: guard_destination
    depends_on: [inspect_destination]
    script: |
      if (ctx.get("tasks.inspect_destination.outputs.destination_exists") == "true" &&
          ctx.get("OVERWRITE") != "true") {
        fail("Destination exists");
      }

  - name: ensure_parent_dir
    depends_on: [guard_destination]
    fallback:
      - shell:
          cmd: "powershell -NoProfile -Command \"$dir = Split-Path -Parent '{{ DST_PATH }}'; if ($dir) { New-Item -ItemType Directory -Force -Path $dir | Out-Null }\""
      - shell:
          cmd: "mkdir -p \"$(dirname \"{{ DST_PATH }}\")\""

  - name: download_file
    depends_on: [ensure_parent_dir]
    fallback:
      - shell:
          cmd: "powershell -NoProfile -Command \"Invoke-WebRequest -Uri '{{ URL }}' -OutFile '{{ DST_PATH }}.tmp'\""
      - shell:
          cmd: "curl -fsSL \"{{ URL }}\" -o \"{{ DST_PATH }}.tmp\""
      - shell:
          cmd: "wget -O \"{{ DST_PATH }}.tmp\" \"{{ URL }}\""

  - name: verify_checksum
    depends_on: [download_file]
    when: "'{{ CHECKSUM }}' != ''"
    fallback:
      - shell:
          cmd: "powershell -NoProfile -Command \"$hash = (Get-FileHash -Algorithm SHA256 '{{ DST_PATH }}.tmp').Hash.ToLower(); if ($hash -ne '{{ CHECKSUM }}'.ToLower()) { Write-Error 'Checksum mismatch'; exit 1 }\""
      - shell:
          cmd: "actual=$(sha256sum \"{{ DST_PATH }}.tmp\" 2>/dev/null | awk '{print $1}'); if [ -z \"$actual\" ]; then actual=$(shasum -a 256 \"{{ DST_PATH }}.tmp\" | awk '{print $1}'); fi; [ \"$actual\" = \"{{ CHECKSUM }}\" ]"

  - name: finalize_without_checksum
    depends_on: [download_file]
    when: "'{{ CHECKSUM }}' == ''"
    fallback:
      - shell:
          cmd: "powershell -NoProfile -Command \"Move-Item -Force '{{ DST_PATH }}.tmp' '{{ DST_PATH }}'\""
      - shell:
          cmd: "mv -f \"{{ DST_PATH }}.tmp\" \"{{ DST_PATH }}\""

  - name: finalize_with_checksum
    depends_on: [verify_checksum]
    when: "'{{ CHECKSUM }}' != ''"
    fallback:
      - shell:
          cmd: "powershell -NoProfile -Command \"Move-Item -Force '{{ DST_PATH }}.tmp' '{{ DST_PATH }}'\""
      - shell:
          cmd: "mv -f \"{{ DST_PATH }}.tmp\" \"{{ DST_PATH }}\""

  - name: emit_result
    depends_on: [finalize_without_checksum, finalize_with_checksum]
    script: |
      var checksumVerified = "false";
      if (ctx.get("CHECKSUM") != "") {
        checksumVerified = "true";
      }
      var jsonStr = "{\"url\":" + json.stringify(ctx.get("URL")) + ", \"path\":" + json.stringify(ctx.get("DST_PATH")) + ", \"checksum_verified\":" + checksumVerified + ", \"status\":" + json.stringify("completed") + "}";
      ctx.output("result", jsonStr);
      log.info("Download complete: " + jsonStr);
