name: Service Restart
description: |
  Restarts a named service and verifies that it returns to running state.

variables:
  SERVICE_NAME: ""

tasks:
  - name: validate_request
    script: |
      var serviceName = ctx.get("SERVICE_NAME");
      if (len(serviceName) == 0) {
        fail("SERVICE_NAME is required");
      }

  - name: restart_service
    depends_on: [validate_request]
    fallback:
      - shell:
          cmd: "powershell -NoProfile -Command \"if (Get-Command Restart-Service -ErrorAction SilentlyContinue) { Restart-Service -Name '{{ SERVICE_NAME }}' -Force } elseif (Get-Command systemctl -ErrorAction SilentlyContinue) { systemctl restart '{{ SERVICE_NAME }}' } else { exit 1 }\""
      - shell:
          cmd: "if command -v systemctl >/dev/null 2>&1; then systemctl restart '{{ SERVICE_NAME }}'; elif command -v service >/dev/null 2>&1; then service '{{ SERVICE_NAME }}' restart; else exit 1; fi"

  - name: verify_running
    depends_on: [restart_service]
    fallback:
      - shell:
          cmd: "powershell -NoProfile -Command \"if (Get-Command Get-Service -ErrorAction SilentlyContinue) { if ((Get-Service -Name '{{ SERVICE_NAME }}' -ErrorAction Stop).Status -ne 'Running') { Write-Error 'Service did not restart'; exit 1 } } elseif (Get-Command systemctl -ErrorAction SilentlyContinue) { if ((systemctl is-active '{{ SERVICE_NAME }}') -ne 'active') { exit 1 } } else { Get-Process -Name '{{ SERVICE_NAME }}' -ErrorAction Stop | Out-Null }\""
      - shell:
          cmd: "if command -v systemctl >/dev/null 2>&1; then [ \"$(systemctl is-active '{{ SERVICE_NAME }}' 2>/dev/null || true)\" = \"active\" ]; elif command -v service >/dev/null 2>&1; then service '{{ SERVICE_NAME }}' status >/dev/null 2>&1; else pgrep -x '{{ SERVICE_NAME }}' >/dev/null 2>&1; fi"

  - name: emit_result
    depends_on: [verify_running]
    script: |
      var jsonStr = "{\"service\":" + json.stringify(ctx.get("SERVICE_NAME")) + ", \"status\":" + json.stringify("running") + ", \"operation\":" + json.stringify("restart") + "}";
      ctx.output("result", jsonStr);
      log.info("Service restarted: " + jsonStr);
