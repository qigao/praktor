name: Archive Create
description: |
  Creates a local archive from a file or directory.

  Variables:
    SRC_PATH      Required source file or directory
    DST_ARCHIVE   Required destination archive path
    FORMAT        zip or tar.gz
    OVERWRITE     Whether to overwrite an existing archive (true|false)

variables:
  SRC_PATH: ""
  DST_ARCHIVE: ""
  FORMAT: "zip"
  OVERWRITE: "false"

tasks:
  - name: validate_request
    script: |
      var sourcePath = ctx.get("SRC_PATH");
      var destinationArchive = ctx.get("DST_ARCHIVE");
      var archiveFormat = ctx.get("FORMAT");
      var overwriteFlag = ctx.get("OVERWRITE");

      if (sourcePath == "") {
        fail("SRC_PATH is required");
      }
      if (destinationArchive == "") {
        fail("DST_ARCHIVE is required");
      }
      if (archiveFormat != "zip" && archiveFormat != "tar.gz") {
        fail("FORMAT must be zip or tar.gz");
      }
      if (overwriteFlag != "true" && overwriteFlag != "false") {
        fail("OVERWRITE must be 'true' or 'false'");
      }

  - name: guard_source
    depends_on: [validate_request]
    fallback:
      - shell:
          cmd: "powershell -NoProfile -Command \"if (-not (Test-Path '{{ SRC_PATH }}')) { Write-Error 'Source path missing'; exit 1 }\""
      - shell:
          cmd: "test -e \"{{ SRC_PATH }}\""

  - name: guard_destination
    depends_on: [guard_source]
    fallback:
      - shell:
          cmd: "powershell -NoProfile -Command \"if ((Test-Path '{{ DST_ARCHIVE }}') -and '{{ OVERWRITE }}' -ne 'true') { Write-Error 'Destination exists'; exit 1 }\""
      - shell:
          cmd: "[ ! -e \"{{ DST_ARCHIVE }}\" ] || [ \"{{ OVERWRITE }}\" = \"true\" ]"

  - name: ensure_parent_dir
    depends_on: [guard_destination]
    fallback:
      - shell:
          cmd: "powershell -NoProfile -Command \"$dir = Split-Path -Parent '{{ DST_ARCHIVE }}'; if ($dir) { New-Item -ItemType Directory -Force -Path $dir | Out-Null }\""
      - shell:
          cmd: "mkdir -p \"$(dirname \"{{ DST_ARCHIVE }}\")\""

  - name: create_zip
    depends_on: [ensure_parent_dir]
    when: "{{ FORMAT }} == 'zip'"
    fallback:
      - shell:
          cmd: "powershell -NoProfile -Command \"if (Test-Path '{{ DST_ARCHIVE }}') { Remove-Item -Force '{{ DST_ARCHIVE }}' }; Compress-Archive -Path '{{ SRC_PATH }}' -DestinationPath '{{ DST_ARCHIVE }}' -Force\""
      - shell:
          cmd: "rm -f \"{{ DST_ARCHIVE }}\" && zip -r \"{{ DST_ARCHIVE }}\" \"{{ SRC_PATH }}\""

  - name: create_tar_gz
    depends_on: [ensure_parent_dir]
    when: "{{ FORMAT }} == 'tar.gz'"
    fallback:
      - shell:
          cmd: "powershell -NoProfile -Command \"if (Test-Path '{{ DST_ARCHIVE }}') { Remove-Item -Force '{{ DST_ARCHIVE }}' }; tar -czf '{{ DST_ARCHIVE }}' '{{ SRC_PATH }}'\""
      - shell:
          cmd: "rm -f \"{{ DST_ARCHIVE }}\" && tar -czf \"{{ DST_ARCHIVE }}\" \"{{ SRC_PATH }}\""

  - name: emit_result
    depends_on: [create_zip, create_tar_gz]
    script: |
      var src = trim(ctx.get("SRC_PATH"));
      var dst = trim(ctx.get("DST_ARCHIVE"));
      var format = ctx.get("FORMAT");
      var jsonStr = "{\"source\":" + json.stringify(src) + ", \"archive\":" + json.stringify(dst) + ", \"format\":" + json.stringify(format) + ", \"status\":" + json.stringify("completed") + "}";
      ctx.output("result", jsonStr);
      log.info("Archive created: " + jsonStr);
