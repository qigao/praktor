name: Process Stop
description: |
  Stops a process by PID or by exact name and verifies that it is gone.

variables:
  PROCESS_NAME: ""
  PID: ""

tasks:
  - name: validate_request
    script: |
      var processName = ctx.get("PROCESS_NAME");
      var processId = ctx.get("PID");
      if (len(processName) == 0 && len(processId) == 0) {
        fail("PROCESS_NAME or PID is required");
      }

  - name: stop_process
    depends_on: [validate_request]
    fallback:
      - shell:
          cmd: "powershell -NoProfile -Command \"$pidValue = '{{ PID }}'; if ($pidValue -ne '') { Stop-Process -Id $pidValue -Force -ErrorAction Stop } else { Stop-Process -Name '{{ PROCESS_NAME }}' -Force -ErrorAction Stop }\""
      - shell:
          cmd: "pid='{{ PID }}'; if [ -n \"$pid\" ]; then kill -TERM \"$pid\" || kill -KILL \"$pid\"; else pkill -TERM -x '{{ PROCESS_NAME }}' || pkill -KILL -x '{{ PROCESS_NAME }}'; fi"

  - name: verify_stopped
    depends_on: [stop_process]
    fallback:
      - shell:
          cmd: "powershell -NoProfile -Command \"$pidValue = '{{ PID }}'; if ($pidValue -ne '') { if (Get-Process -Id $pidValue -ErrorAction SilentlyContinue) { Write-Error 'Process still running'; exit 1 } } else { if (Get-Process -Name '{{ PROCESS_NAME }}' -ErrorAction SilentlyContinue) { Write-Error 'Process still running'; exit 1 } }\""
      - shell:
          cmd: "pid='{{ PID }}'; name='{{ PROCESS_NAME }}'; attempts=50; while [ \"$attempts\" -gt 0 ]; do if [ -n \"$pid\" ]; then state=$(ps -p \"$pid\" -o stat= 2>/dev/null | tr -d '[:space:]'); [ -z \"$state\" ] && exit 0; case \"$state\" in Z*) exit 0 ;; esac; else if ! pgrep -x \"$name\" >/dev/null 2>&1; then exit 0; fi; fi; attempts=$((attempts-1)); sleep 0.1; done; exit 1"

  - name: emit_result
    depends_on: [verify_stopped]
    script: |
      var jsonStr = "{\"process_name\":" + json.stringify(ctx.get("PROCESS_NAME")) + ", \"pid\":" + json.stringify(ctx.get("PID")) + ", \"status\":" + json.stringify("stopped") + "}";
      ctx.output("result", jsonStr);
      log.info("Process stopped: " + jsonStr);
