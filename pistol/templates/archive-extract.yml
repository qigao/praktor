name: Archive Extract
description: |
  Extracts a local archive into a destination directory.

  Variables:
    SRC_ARCHIVE   Required source archive path
    DST_DIR       Required destination directory
    FORMAT        zip or tar.gz

variables:
  SRC_ARCHIVE: ""
  DST_DIR: ""
  FORMAT: "zip"

tasks:
  - name: validate_request
    script: |
      var sourceArchive = ctx.get("SRC_ARCHIVE");
      var destinationDir = ctx.get("DST_DIR");
      var archiveFormat = ctx.get("FORMAT");

      if (sourceArchive == "") {
        fail("SRC_ARCHIVE is required");
      }
      if (destinationDir == "") {
        fail("DST_DIR is required");
      }
      if (archiveFormat != "zip" && archiveFormat != "tar.gz") {
        fail("FORMAT must be zip or tar.gz");
      }

  - name: guard_source
    depends_on: [validate_request]
    fallback:
      - shell:
          cmd: "powershell -NoProfile -Command \"if (-not (Test-Path '{{ SRC_ARCHIVE }}')) { Write-Error 'Archive missing'; exit 1 }\""
      - shell:
          cmd: "test -f \"{{ SRC_ARCHIVE }}\""

  - name: ensure_destination_dir
    depends_on: [guard_source]
    fallback:
      - shell:
          cmd: "powershell -NoProfile -Command \"New-Item -ItemType Directory -Force -Path '{{ DST_DIR }}' | Out-Null\""
      - shell:
          cmd: "mkdir -p \"{{ DST_DIR }}\""

  - name: extract_zip
    depends_on: [ensure_destination_dir]
    when: "{{ FORMAT }} == 'zip'"
    fallback:
      - shell:
          cmd: "powershell -NoProfile -Command \"Expand-Archive -Path '{{ SRC_ARCHIVE }}' -DestinationPath '{{ DST_DIR }}' -Force\""
      - shell:
          cmd: "unzip -o \"{{ SRC_ARCHIVE }}\" -d \"{{ DST_DIR }}\""

  - name: extract_tar_gz
    depends_on: [ensure_destination_dir]
    when: "{{ FORMAT }} == 'tar.gz'"
    fallback:
      - shell:
          cmd: "powershell -NoProfile -Command \"tar -xzf '{{ SRC_ARCHIVE }}' -C '{{ DST_DIR }}'\""
      - shell:
          cmd: "tar -xzf \"{{ SRC_ARCHIVE }}\" -C \"{{ DST_DIR }}\""

  - name: emit_result
    depends_on: [extract_zip, extract_tar_gz]
    script: |
      var src = trim(ctx.get("SRC_ARCHIVE"));
      var dst = trim(ctx.get("DST_DIR"));
      var jsonStr = "{\"source\":" + json.stringify(src) + ", \"destination\":" + json.stringify(dst) + ", \"status\":" + json.stringify("completed") + "}";
      ctx.output("result", jsonStr);
      log.info("Archive extracted: " + jsonStr);
