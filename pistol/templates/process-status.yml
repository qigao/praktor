name: Process Status
description: |
  Queries whether a process is present by PID or by exact name.

variables:
  PROCESS_NAME: ""
  PID: ""

tasks:
  - name: validate_request
    script: |
      var processName = ctx.get("PROCESS_NAME");
      var processId = ctx.get("PID");
      if (len(processName) == 0 && len(processId) == 0) {
        fail("PROCESS_NAME or PID is required");
      }

  - name: query_process
    depends_on: [validate_request]
    fallback:
      - shell:
          cmd: "powershell -NoProfile -Command \"$pidValue = '{{ PID }}'; if ($pidValue -ne '') { (Get-Process -Id $pidValue -ErrorAction Stop).Id } else { (Get-Process -Name '{{ PROCESS_NAME }}' -ErrorAction Stop | Select-Object -First 1).Id }\""
          output_key: matched_pid
      - shell:
          cmd: "pid='{{ PID }}'; if [ -n \"$pid\" ]; then ps -p \"$pid\" -o pid=; else pgrep -x '{{ PROCESS_NAME }}' | head -n 1; fi"
          output_key: matched_pid
  - name: emit_result
    depends_on: [query_process]
    script: |
      var running = ctx.get("tasks.query_process.status") != "failed";
      var statusValue = "absent";
      if (running) {
        statusValue = "running";
      }
      var runningStr = "false";
      if (running) { runningStr = "true"; statusValue = "running"; }
      var pidVal = trim(ctx.get("tasks.query_process.outputs.matched_pid"));
      var jsonStr = "{\"process_name\":" + json.stringify(ctx.get("PROCESS_NAME")) + ", \"pid\":" + json.stringify(pidVal) + ", \"running\":" + runningStr + ", \"status\":" + json.stringify(statusValue) + "}";
      ctx.output("result", jsonStr);
      log.info("Process status: " + jsonStr);
