name: Full Ops Agent
description: |
  Combined auto-ops workflow: remote command receiver + host health + process monitoring.
  Designed for a single periodic execution cycle.

  This template now does only what it truly supports:
    1. Fetch supported remote commands
    2. Execute supported remote commands
    3. Check host health (CPU, memory, disk)
    4. Check critical processes for liveness
    5. Report results upstream
    6. Write a local ops report

variables:
  HOSTNAME: "{{ PRAKTOR_HOST }}"
  CPU_THRESHOLD: "90"
  MEM_THRESHOLD: "85"
  DISK_THRESHOLD: "90"
  SERVICES: "nginx,redis-server"
  CMD_ENDPOINT: "{{ env.CMD_ENDPOINT }}"
  ALERT_WEBHOOK: "{{ env.ALERT_WEBHOOK }}"
  AUTH_TOKEN: "{{ env.OPS_AUTH_TOKEN }}"

tasks:
  - name: alert_ops_failure
    script: |
      var host = ctx.get("HOSTNAME");
      var task = ctx.get("failed_inner_task_name");
      if not task {
        task = ctx.get("failed_task_name");
      }
      var error = ctx.get("failed_inner_task_error");
      if not error {
        error = ctx.get("failed_task_error");
      }
      var webhook = ctx.get("ALERT_WEBHOOK");
      log.error("[ALERT] " + host + " | " + task + ": " + error);
      if webhook != "" {
        http.post(webhook, json.stringify({
          "text": "[ALERT] " + host + " | " + task + ": " + error
        }));
      }

  - name: fetch_remote_commands
    when: "'{{ CMD_ENDPOINT }}' != ''"
    script: |
      var endpoint = ctx.get("CMD_ENDPOINT");
      var token = ctx.get("AUTH_TOKEN");
      var agent = ctx.get("HOSTNAME");

      var resp = http.get(endpoint + "?agent=" + agent, {
        "headers": {"Authorization": "Bearer " + token},
        "timeout": 10000
      });

      if resp.status != 200 {
        log.warn("Failed to fetch commands: HTTP " + resp.status);
        ctx.output("commands", []);
        ctx.output("executable_commands", []);
        ctx.output("unsupported_results", []);
        ctx.output("count", 0);
        ctx.output("executable_count", 0);
        return;
      }

      var cmds = resp.data;
      if not cmds {
        cmds = [];
      }

      var executable = [];
      var unsupported = [];
      for cmd in cmds {
        var normalized = {
          "id": cmd.id,
          "action": cmd.action,
          "command": ""
        };

        if cmd.action == "run_command" and cmd.params.command {
          normalized.command = cmd.params.command;
          executable = executable + [normalized];
        } else if cmd.action == "restart_service" and cmd.params.service {
          var svc = cmd.params.service;
          normalized.command = "systemctl restart " + svc + " || (net stop " + svc + " && net start " + svc + ")";
          executable = executable + [normalized];
        } else {
          unsupported = unsupported + [{
            "id": cmd.id,
            "action": cmd.action,
            "status": "unsupported",
            "agent": agent
          }];
        }
      }

      ctx.output("commands", cmds);
      ctx.output("executable_commands", executable);
      ctx.output("unsupported_results", unsupported);
      ctx.output("count", json.query(cmds, "length(@)"));
      ctx.output("executable_count", json.query(executable, "length(@)"));
      log.info("Remote commands: " + json.query(cmds, "length(@)") + " pending");

  - name: execute_remote_commands
    depends_on: [fetch_remote_commands]
    when: "{{ tasks.fetch_remote_commands.outputs.executable_count }} > 0"
    dynamic_tasks:
      items_variable: "{{ tasks.fetch_remote_commands.outputs.executable_commands }}"
      template:
        name: "remote_{{ item.id }}"
        command: "{{ item.command }}"
    continue_on_error: true
    triggers:
      on_failure: [alert_ops_failure]

  - name: check_cpu
    depends_on: [execute_remote_commands]
    fallback:
      - shell:
          cmd: powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).LoadPercentage"
          output_key: cpu_load
      - shell:
          cmd: top -bn1 | grep 'Cpu(s)' | awk '{print 100 - $8}'
          output_key: cpu_load
    script: |
      var cpu = ctx.get("tasks.check_cpu.outputs.cpu_load");
      var threshold = ctx.get("CPU_THRESHOLD");
      ctx.output("cpu_percent", cpu);
      log.info("CPU: " + cpu + "% (threshold: " + threshold + "%)");
      if math.eval(cpu + " > " + threshold) {
        fail("CPU at " + cpu + "% exceeds " + threshold + "%");
      }
    continue_on_error: true
    triggers:
      on_failure: [alert_ops_failure]

  - name: check_memory
    depends_on: [execute_remote_commands]
    fallback:
      - shell:
          cmd: powershell -NoProfile -Command "$os=Get-CimInstance Win32_OperatingSystem;[math]::Round(($os.TotalVisibleMemorySize-$os.FreePhysicalMemory)/$os.TotalVisibleMemorySize*100)"
          output_key: mem_percent
      - shell:
          cmd: free | awk '/Mem:/ {printf "%.0f", $3/$2*100}'
          output_key: mem_percent
    script: |
      var mem = ctx.get("tasks.check_memory.outputs.mem_percent");
      var threshold = ctx.get("MEM_THRESHOLD");
      ctx.output("mem_percent", mem);
      log.info("Memory: " + mem + "% (threshold: " + threshold + "%)");
      if math.eval(mem + " > " + threshold) {
        fail("Memory at " + mem + "% exceeds " + threshold + "%");
      }
    continue_on_error: true
    triggers:
      on_failure: [alert_ops_failure]

  - name: check_disk
    depends_on: [execute_remote_commands]
    fallback:
      - shell:
          cmd: powershell -NoProfile -Command "Get-PSDrive C|ForEach-Object{[math]::Round(($_.Used/($_.Used+$_.Free))*100)}"
          output_key: disk_percent
      - shell:
          cmd: df / | tail -1 | awk '{print $5}' | tr -d '%'
          output_key: disk_percent
    script: |
      var disk = ctx.get("tasks.check_disk.outputs.disk_percent");
      var threshold = ctx.get("DISK_THRESHOLD");
      ctx.output("disk_percent", disk);
      log.info("Disk: " + disk + "% (threshold: " + threshold + "%)");
      if math.eval(disk + " > " + threshold) {
        fail("Disk at " + disk + "% exceeds " + threshold + "%");
      }
    continue_on_error: true
    triggers:
      on_failure: [alert_ops_failure]

  - name: discover_services
    depends_on: [execute_remote_commands]
    script: |
      var csv = ctx.get("SERVICES");
      var items = [];
      for part in csv.split(",") {
        var name = part.trim();
        if name != "" {
          items = items + [{"name": name}];
        }
      }
      ctx.output("services", items);
      log.info("Services to monitor: " + json.stringify(items));

  - name: check_services
    depends_on: [discover_services]
    dynamic_tasks:
      items_variable: "{{ tasks.discover_services.outputs.services }}"
      template:
        name: "svc_check_{{ item.name }}"
        command: "pgrep -x {{ item.name }} || tasklist /FI \"IMAGENAME eq {{ item.name }}.exe\" /NH 2>nul | findstr /I \"{{ item.name }}\""
    continue_on_error: true
    triggers:
      on_failure: [alert_ops_failure]

  - name: generate_report
    depends_on: [check_cpu, check_memory, check_disk, check_services]
    script: |
      var status = "ok";
      if ctx.get("tasks.check_cpu.status") == "failed" {
        status = "degraded";
      }
      if ctx.get("tasks.check_memory.status") == "failed" {
        status = "degraded";
      }
      if ctx.get("tasks.check_disk.status") == "failed" {
        status = "degraded";
      }
      if ctx.get("tasks.check_services.outputs.failed_count") > 0 {
        status = "degraded";
      }
      if ctx.get("tasks.execute_remote_commands.outputs.failed_count") > 0 {
        status = "degraded";
      }

      var remote_results = ctx.get("tasks.fetch_remote_commands.outputs.unsupported_results");
      if not remote_results {
        remote_results = [];
      }
      var executed = ctx.get("tasks.execute_remote_commands.outputs.generated_tasks");
      if executed {
        for item in executed {
          remote_results = remote_results + [{
            "id": item.item.id,
            "action": item.item.action,
            "status": item.status,
            "agent": ctx.get("HOSTNAME")
          }];
        }
      }

      var report = {
        "host": ctx.get("HOSTNAME"),
        "health": {
          "cpu_percent": ctx.get("tasks.check_cpu.outputs.cpu_percent"),
          "mem_percent": ctx.get("tasks.check_memory.outputs.mem_percent"),
          "disk_percent": ctx.get("tasks.check_disk.outputs.disk_percent")
        },
        "services": ctx.get("tasks.check_services.outputs.generated_tasks"),
        "remote_commands": remote_results,
        "status": status
      };

      ctx.output("report", report);
      fs.write("./ops-report.json", json.stringify(report));
      log.info("Ops cycle complete: " + json.stringify(report));

  - name: report_upstream
    depends_on: [generate_report]
    when: "'{{ CMD_ENDPOINT }}' != ''"
    script: |
      var endpoint = ctx.get("CMD_ENDPOINT");
      var token = ctx.get("AUTH_TOKEN");
      var report = ctx.get("tasks.generate_report.outputs.report");

      http.post(endpoint + "/report", json.stringify(report), {
        "headers": {
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json"
        }
      });
      log.info("Report sent upstream");
