name: Process Monitor
description: |
  Monitors critical processes for liveness and reports failures.
  This template does not pretend to auto-restart arbitrary services.
  If restart behavior is needed, use `service-check.yml` with an explicit RESTART_CMD.

variables:
  SERVICES: "nginx,redis-server,postgres"
  ALERT_WEBHOOK: "{{ env.ALERT_WEBHOOK }}"
  HOSTNAME: "{{ PRAKTOR_HOST }}"

tasks:
  - name: alert_process_down
    script: |
      var host = ctx.get("HOSTNAME");
      var svc = ctx.get("failed_inner_task_name");
      if not svc {
        svc = ctx.get("failed_task_name");
      }
      var error = ctx.get("failed_inner_task_error");
      if not error {
        error = ctx.get("failed_task_error");
      }
      var webhook = ctx.get("ALERT_WEBHOOK");
      log.error("[CRITICAL] " + host + " | Process down: " + svc + " | " + error);
      if webhook != "" {
        var body = json.stringify({
          "text": "[CRITICAL] " + host + " | " + svc + " is DOWN.\nError: " + error
        });
        http.post(webhook, body);
      }

  - name: discover_services
    script: |
      var csv = ctx.get("SERVICES");
      var items = [];
      for part in csv.split(",") {
        var name = part.trim();
        if name != "" {
          items = items + [{"name": name}];
        }
      }
      ctx.output("services", items);
      log.info("Monitoring " + json.stringify(items));

  - name: check_all_services
    depends_on: [discover_services]
    dynamic_tasks:
      items_variable: "{{ tasks.discover_services.outputs.services }}"
      template:
        name: "check_{{ item.name }}"
        command: "pgrep -x {{ item.name }} || tasklist /FI \"IMAGENAME eq {{ item.name }}.exe\" /NH 2>nul | findstr /I \"{{ item.name }}\""
    continue_on_error: true
    triggers:
      on_failure: [alert_process_down]

  - name: process_summary
    depends_on: [check_all_services]
    script: |
      var host = ctx.get("HOSTNAME");
      var services = ctx.get("tasks.discover_services.outputs.services");
      var results = ctx.get("tasks.check_all_services.outputs.generated_tasks");
      var failed = ctx.get("tasks.check_all_services.outputs.failed_count");
      var status = "ok";
      if failed > 0 {
        status = "degraded";
      }

      var summary = {
        "host": host,
        "service_count": json.query(services, "length(@)"),
        "failed_count": failed,
        "results": results,
        "status": status
      };
      ctx.output("summary", summary);
      fs.write("./process-health.json", json.stringify(summary));
      log.info("Process monitor complete: " + json.stringify(summary));
