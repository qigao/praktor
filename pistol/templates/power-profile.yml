name: Power Profile
description: |
  Requests a host power profile change.

  Variables:
    MODE     balanced | powersave | performance
    MESSAGE  Optional operator-visible note for audit output only

  Behavior:
    1. Validate the requested mode
    2. Attempt the native power-profile command for the active platform
    3. Emit a structured result if the request was accepted

variables:
  MODE: "balanced"
  MESSAGE: "Power profile change requested by Praktor"

tasks:
  - name: validate_request
    fallback:
      - shell:
          cmd: "powershell -NoProfile -Command \"if ('{{ MODE }}' -notin @('balanced','powersave','performance')) { Write-Error 'MODE must be balanced, powersave, or performance'; exit 1 }\""
      - shell:
          cmd: "case '{{ MODE }}' in balanced|powersave|performance) : ;; *) echo 'MODE must be balanced, powersave, or performance' >&2; exit 1;; esac"

  - name: plan_profile
    depends_on: [validate_request]
    script: |
      var mode = ctx.get("MODE");
      var windowsScheme = "SCHEME_BALANCED";
      var linuxMode = "balanced";

      if mode == "powersave" {
        windowsScheme = "SCHEME_MIN";
        linuxMode = "power-saver";
      } else if mode == "performance" {
        windowsScheme = "SCHEME_MAX";
        linuxMode = "performance";
      }

      ctx.output("windows_scheme", windowsScheme);
      ctx.output("linux_mode", linuxMode);

  - name: apply_power_profile
    depends_on: [plan_profile]
    fallback:
      - shell:
          cmd: "powershell -NoProfile -Command \"powercfg /S {{ tasks.plan_profile.outputs.windows_scheme }}\""
      - shell:
          cmd: "if command -v powerprofilesctl >/dev/null 2>&1; then powerprofilesctl set '{{ tasks.plan_profile.outputs.linux_mode }}'; else echo 'No supported power profile command found' >&2; exit 1; fi"

  - name: emit_result
    depends_on: [apply_power_profile]
    script: |
      var result = {
        "action": "power_profile",
        "mode": ctx.get("MODE"),
        "message": ctx.get("MESSAGE"),
        "status": "accepted"
      };
      ctx.output("result", json.stringify(result));
      log.info("Power profile requested: " + json.stringify(result));
