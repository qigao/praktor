name: Session Logoff
description: |
  Logs off the current interactive session.

  Variables:
    SESSION_ID  Optional session id for Linux desktops; defaults from XDG_SESSION_ID when available
    MESSAGE     Optional operator-visible note for audit output only

  Behavior:
    1. Attempt to log off the current session on the active platform
    2. Emit a structured result if the command was accepted

variables:
  SESSION_ID: "{{ env.XDG_SESSION_ID }}"
  MESSAGE: "Session logoff requested by Praktor"

tasks:
  - name: logoff_session
    fallback:
      - shell:
          cmd: "powershell -NoProfile -Command \"Start-Process shutdown.exe -ArgumentList @('/l') -Wait\""
      - shell:
          cmd: "if command -v loginctl >/dev/null 2>&1 && [ -n \"{{ SESSION_ID }}\" ]; then loginctl terminate-session \"{{ SESSION_ID }}\"; elif command -v gnome-session-quit >/dev/null 2>&1; then gnome-session-quit --logout --no-prompt; else echo 'No supported session logoff command found' >&2; exit 1; fi"

  - name: emit_result
    depends_on: [logoff_session]
    script: |
      var jsonStr = "{\"action\":" + json.stringify("logoff_session") + ", \"session_id\":" + json.stringify(ctx.get("SESSION_ID")) + ", \"message\":" + json.stringify(ctx.get("MESSAGE")) + ", \"status\":" + json.stringify("accepted") + "}";
      ctx.output("result", jsonStr);
      log.info("Session logoff requested: " + jsonStr);
