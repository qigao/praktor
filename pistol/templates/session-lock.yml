name: Session Lock
description: |
  Locks the current interactive desktop session.

  Variables:
    MESSAGE  Optional operator-visible note for audit output only

  Behavior:
    1. Attempt the native lock command for the current platform
    2. Emit a structured result if the lock command was accepted

variables:
  MESSAGE: "Session lock requested by Praktor"

tasks:
  - name: lock_session
    fallback:
      - shell:
          cmd: "powershell -NoProfile -Command \"rundll32.exe user32.dll,LockWorkStation\""
      - shell:
          cmd: "if command -v loginctl >/dev/null 2>&1 && [ -n \"$XDG_SESSION_ID\" ]; then loginctl lock-session \"$XDG_SESSION_ID\"; elif command -v xdg-screensaver >/dev/null 2>&1; then xdg-screensaver lock; elif command -v gnome-screensaver-command >/dev/null 2>&1; then gnome-screensaver-command -l; else echo 'No supported session lock command found' >&2; exit 1; fi"

  - name: emit_result
    depends_on: [lock_session]
    script: |
      var jsonStr = "{\"action\":" + json.stringify("lock_session") + ", \"message\":" + json.stringify(ctx.get("MESSAGE")) + ", \"status\":" + json.stringify("accepted") + "}";
      ctx.output("result", jsonStr);
      log.info("Session lock requested: " + jsonStr);
