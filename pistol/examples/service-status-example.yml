name: Service Status Example
description: |
  Minimal wrapper around the reusable service status template.

variables:
  SERVICE_NAME: "nginx"

tasks:
  - name: service_status
    uses: ../templates/service-status.yml
    vars:
      SERVICE_NAME: "{{ SERVICE_NAME }}"

  - name: emit_result
    depends_on: [service_status]
    script: |
      ctx.output("result", ctx.get("tasks.service_status.outputs.result"));
