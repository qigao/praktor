name: Host Suspend Example
description: |
  Standalone Behavior Tree (BT) workflow for suspending the host.

tasks:
  - name: host_suspend
    script: |
      import("os");
      var platform = os.platform_name();
      var handle = null;
      if (platform == "windows") {
        handle = os.process_start("rundll32.exe", "powrprof.dll,SetSuspendState", "0", "1", "0");
      } else {
        handle = os.process_start("systemctl", "suspend");
      }
      var process_result = null;
      var output = "";
      var success = false;
      if (handle != null) {
        process_result = os.process_wait(handle);
        output = os.process_read_stdout(handle);
        if (output == "") {
          output = os.process_read_stderr(handle);
        }
        os.process_close(handle);
        success = process_result.exit_code == 0 and process_result.error_code == 0 and process_result.wait_code == 0;
      }
      ctx.output("success", success);
      ctx.output("process", process_result);
      ctx.output("output", output);

  - name: emit_result
    depends_on: [host_suspend]
    script: |
      import("./result_models.tbs");
      var accepted = ctx.get("tasks.host_suspend.outputs.success") == true;
      var status = "rejected";
      if (accepted) {
        status = "accepted";
      }
      var payload = ProcessResult();
      payload.status = status;
      payload.process = "host";
      payload.pid = "";
      payload.output = ctx.get("tasks.host_suspend.outputs.output");
      payload.action = make_action_result(
        "suspend", "host", accepted, false,
        ctx.get("tasks.host_suspend.outputs.process"));
      var jsonStr = mapper.write_json(payload);
      ctx.output_text("result", jsonStr);
      log.info("Host suspend result: " + jsonStr);
