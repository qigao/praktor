name: Session Logoff Example
description: |
  Standalone Behavior Tree (BT) workflow for logging off the current user session.

tasks:
  - name: session_logoff
    script: |
      import("os");
      var handle = null;
      if (os.platform_name() == "windows") {
        handle = os.process_start("shutdown.exe", "/l");
      } else {
        handle = os.process_start("loginctl", "terminate-session", "self");
      }
      var process_result = null;
      var output = "";
      var success = false;
      if (handle != null) {
        process_result = os.process_wait(handle);
        output = os.process_read_stdout(handle);
        if (output == "") {
          output = os.process_read_stderr(handle);
        }
        os.process_close(handle);
        success = process_result.exit_code == 0 and process_result.error_code == 0 and process_result.wait_code == 0;
      }
      ctx.output("success", success);
      ctx.output("process", process_result);
      ctx.output("output", output);

  - name: emit_result
    depends_on: [session_logoff]
    script: |
      import("./result_models.tbs");
      var success = ctx.get("tasks.session_logoff.outputs.success") == true;
      var status = "failed";
      if (success) {
        status = "success";
      }
      var payload = ProcessResult();
      payload.status = status;
      payload.process = "session";
      payload.pid = "";
      payload.output = ctx.get("tasks.session_logoff.outputs.output");
      payload.action = make_action_result(
        "logoff", "session", success, false,
        ctx.get("tasks.session_logoff.outputs.process"));
      var jsonStr = mapper.write_json(payload);
      ctx.output_text("result", jsonStr);
      log.info("Session logoff result: " + jsonStr);
