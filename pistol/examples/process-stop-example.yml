name: Process Stop Example
description: |
  Minimal wrapper around the reusable process stop template.

variables:
  PROCESS_NAME: "nginx"
  PID: ""

tasks:
  - name: process_stop
    uses: ../templates/process-stop.yml
    vars:
      PROCESS_NAME: "{{ PROCESS_NAME }}"
      PID: "{{ PID }}"

  - name: emit_result
    depends_on: [process_stop]
    script: |
      ctx.output("result", ctx.get("tasks.process_stop.outputs.result"));
