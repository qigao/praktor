name: Process Stop Example
description: |
  Standalone Behavior Tree (BT) workflow for stopping a running process by name.

variables:
  PROCESS_NAME: "ping"

tasks:
  - name: process_stop
    script: |
      import("os");
      var process_name = ctx.get("PROCESS_NAME");
      var handle = null;
      if (os.platform_name() == "windows") {
        handle = os.process_start("taskkill.exe", "/IM", process_name + ".exe", "/F");
      } else {
        handle = os.process_start("pkill", "-x", process_name);
      }
      var process_result = null;
      var output = "";
      var success = false;
      if (handle != null) {
        process_result = os.process_wait(handle);
        output = os.process_read_stdout(handle);
        if (output == "") {
          output = os.process_read_stderr(handle);
        }
        os.process_close(handle);
        success = process_result.exit_code == 0 and process_result.error_code == 0 and process_result.wait_code == 0;
      }
      ctx.output("success", success);
      ctx.output("process", process_result);
      ctx.output("output", output);

  - name: emit_result
    depends_on: [process_stop]
    script: |
      import("./result_models.tbs");
      var success = ctx.get("tasks.process_stop.outputs.success") == true;
      var status = "failed";
      if (success) {
        status = "success";
      }
      var payload = ProcessResult();
      payload.status = status;
      payload.process = ctx.get("PROCESS_NAME");
      payload.pid = "";
      payload.output = ctx.get("tasks.process_stop.outputs.output");
      payload.action = make_action_result(
        "stop", ctx.get("PROCESS_NAME"), success, false,
        ctx.get("tasks.process_stop.outputs.process"));
      var jsonStr = mapper.write_json(payload);
      ctx.output_text("result", jsonStr);
      log.info("Process stop result: " + jsonStr);
