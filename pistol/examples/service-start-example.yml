name: Service Start Example
description: |
  Standalone Behavior Tree (BT) workflow for starting a system service.

variables:
  SERVICE_NAME: "nginx"

tasks:
  - name: service_start
    script: |
      import("os");
      var result = os.service_start(ctx.get("SERVICE_NAME"));
      ctx.output("result", result);

  - name: emit_result
    depends_on: [service_start]
    script: |
      import("mapper");
      class ServiceStartResult {
        service: string;
        success: bool;
        action: string;
        details: map;
      }
      var result = ctx.get("tasks.service_start.outputs.result");
      var payload = ServiceStartResult();
      payload.service = ctx.get("SERVICE_NAME");
      payload.success = result != null and result.success == 1;
      payload.action = "start";
      payload.details = result;
      var jsonStr = mapper.write_json(payload);
      ctx.output("result", jsonStr);
      log.info("Service start result: " + jsonStr);
