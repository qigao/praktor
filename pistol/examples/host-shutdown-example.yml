name: Host Shutdown Example
description: |
  Standalone Behavior Tree (BT) workflow for issuing a host shutdown command.

variables:
  REASON: "Scheduled maintenance"

tasks:
  - name: host_shutdown
    script: |
      import("os");
      var result = os.shutdown();
      ctx.output("result", result);

  - name: emit_result
    depends_on: [host_shutdown]
    script: |
      import("mapper");
      class HostShutdownResult {
        action: string;
        accepted: bool;
        reason: string;
        details: map;
      }
      var result = ctx.get("tasks.host_shutdown.outputs.result");
      var payload = HostShutdownResult();
      payload.action = "shutdown";
      payload.accepted = result != null and result.success == 1;
      payload.reason = ctx.get("REASON");
      payload.details = result;
      var jsonStr = mapper.write_json(payload);
      ctx.output_text("result", jsonStr);
      log.info("Host shutdown result: " + jsonStr);
