name: Service Stop Example
description: |
  Standalone Behavior Tree (BT) workflow for stopping a system service.

variables:
  SERVICE_NAME: "nginx"

tasks:
  - name: service_stop
    script: |
      import("os");
      var result = os.service_stop(ctx.get("SERVICE_NAME"));
      ctx.output("result", result);

  - name: emit_result
    depends_on: [service_stop]
    script: |
      import("mapper");
      class ServiceStopResult {
        service: string;
        success: bool;
        action: string;
        details: map;
      }
      var result = ctx.get("tasks.service_stop.outputs.result");
      var payload = ServiceStopResult();
      payload.service = ctx.get("SERVICE_NAME");
      payload.success = result != null and result.success == 1;
      payload.action = "stop";
      payload.details = result;
      var jsonStr = mapper.write_json(payload);
      ctx.output("result", jsonStr);
      log.info("Service stop result: " + jsonStr);
