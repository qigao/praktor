# Praktor CI/CD Pipeline with YAML action orchestration tasks
# This demonstrates action orchestration authored directly in YAML

name: CI Pipeline with Action Orchestration

# Environment variables available to all tasks
env:
  BUILD_DIR: build
  PROJECT_NAME: MyProject

tasks:
  # Task 1: Build using YAML action orchestration
  - name: build
    description: Build the project with error handling
    sequence:
      - shell:
          cmd: cmake -B build
          output_key: cmake_output
      - fallback:
          - check_exit_code:
              input_key: shell_exit_code
              expected: 0
          - sequence:
              - shell: echo CMake failed!
              - shell: cat build/CMakeFiles/CMakeError.log
      - shell:
          cmd: cmake --build build
          output_key: build_output
          timeout: 300000
      - parse_regex:
          input_key: build_output
          pattern: "Built target (\\w+)"
          capture_group: 1
          output_key: built_target

  # Task 2: Test with result parsing
  - name: test
    depends_on: [build]
    description: Run tests and parse results
    sequence:
      - shell:
          cmd: cd build && ctest --output-on-failure
          output_key: test_output
      - parse_regex:
          input_key: test_output
          pattern: "(\\d+)% tests passed"
          capture_group: 1
          output_key: pass_rate
      - fallback:
          - check_exit_code:
              expected: 0
          - sequence:
              - shell: echo Tests failed!
              - shell: cat build/Testing/Temporary/LastTest.log

  # Task 3: Code coverage analysis
  - name: coverage
    depends_on: [test]
    description: Analyze code coverage
    sequence:
      - shell:
          cmd: gcov -r *.cpp
          output_key: coverage_output
      - parse_regex:
          input_key: coverage_output
          pattern: "Lines executed:(\\d+\\.\\d+)%"
          capture_group: 1
          output_key: coverage_percent

  # Task 4: Static analysis
  - name: lint
    depends_on: [build]
    description: Run static analysis
    parallel:
      - sequence:
          - shell:
              cmd: clang-tidy src/*.cpp
              output_key: tidy_output
          - parse_regex:
              input_key: tidy_output
              pattern: "(\\d+) warnings generated"
              capture_group: 1
              output_key: warning_count
      - shell: cppcheck --enable=all src/

  # Task 5: Package with version extraction
  - name: package
    depends_on: [test, coverage, lint]
    description: Create release package
    sequence:
      - shell:
          cmd: git describe --tags
          output_key: version_output
      - parse_regex:
          input_key: version_output
          pattern: "v([0-9.]+)"
          capture_group: 1
          output_key: version
      - shell:
          cmd: cpack -B dist
          output_key: package_output

  # Task 6: Deploy with conditional logic
  - name: deploy
    depends_on: [package]
    description: Deploy to server with fallback
    fallback:
      - sequence:
          - shell: scp dist/*.tar.gz user@prod-server:/releases/
          - shell: ssh user@prod-server 'systemctl restart myapp'
      - sequence:
          - shell: echo Primary deployment failed, trying backup...
          - shell: scp dist/*.tar.gz user@backup-server:/releases/
          - shell: ssh user@backup-server 'systemctl restart myapp'
      - shell: echo All deployment attempts failed!

  # Task 7: Notification with JSON parsing
  - name: notify
    depends_on: [deploy]
    description: Send notification via webhook
    sequence:
      - shell:
          cmd: "curl -X POST https://api.slack.com/webhook -d '{\"status\":\"success\"}'"
          output_key: webhook_response
      - parse_json:
          input_key: webhook_response
          path: $.ok
          output_key: webhook_status

# Workflow execution order (determined by depends_on):
# build -> [test, lint] -> coverage -> package -> deploy -> notify
